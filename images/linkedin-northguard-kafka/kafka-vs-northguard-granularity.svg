<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0E1A"/>
      <stop offset="100%" stop-color="#14182B"/>
    </linearGradient>
    <linearGradient id="kafkaBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="760" height="440" fill="url(#bg)"/>
  <text x="380" y="26" text-anchor="middle" fill="#ffffff" font-family="system-ui" font-size="17" font-weight="800">Kafka Partition vs Northguard Segment</text>
  <text x="380" y="46" text-anchor="middle" fill="#94A3B8" font-family="system-ui" font-size="12">100 GB partition = 100 × 1 GB segments. Unit of replication is 100× finer.</text>

  <!-- Divider -->
  <line x1="380" y1="70" x2="380" y2="400" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Left: Kafka -->
  <text x="190" y="90" text-anchor="middle" fill="#F59E0B" font-family="system-ui" font-size="14" font-weight="800">KAFKA</text>
  <text x="190" y="108" text-anchor="middle" fill="#94A3B8" font-family="system-ui" font-size="11">1 Partition — 100 GB, long-lived</text>

  <rect x="50" y="130" width="280" height="210" rx="8" fill="url(#kafkaBar)" opacity="0.85" filter="url(#glow)"/>
  <!-- Long log sweep -->
  <g opacity="0.35">
    <line x1="65" y1="155" x2="315" y2="155" stroke="#FEF3C7" stroke-width="1"/>
    <line x1="65" y1="175" x2="315" y2="175" stroke="#FEF3C7" stroke-width="1"/>
    <line x1="65" y1="195" x2="315" y2="195" stroke="#FEF3C7" stroke-width="1"/>
    <line x1="65" y1="215" x2="315" y2="215" stroke="#FEF3C7" stroke-width="1"/>
    <line x1="65" y1="235" x2="315" y2="235" stroke="#FEF3C7" stroke-width="1"/>
    <line x1="65" y1="255" x2="315" y2="255" stroke="#FEF3C7" stroke-width="1"/>
    <line x1="65" y1="275" x2="315" y2="275" stroke="#FEF3C7" stroke-width="1"/>
    <line x1="65" y1="295" x2="315" y2="295" stroke="#FEF3C7" stroke-width="1"/>
    <line x1="65" y1="315" x2="315" y2="315" stroke="#FEF3C7" stroke-width="1"/>
  </g>
  <!-- Sweep beam -->
  <rect x="50" y="130" width="12" height="210" fill="#FEF3C7" opacity="0.5">
    <animate attributeName="x" values="50;318;50" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="190" y="235" text-anchor="middle" fill="#0A0E1A" font-family="system-ui" font-size="16" font-weight="800">1 PARTITION</text>
  <text x="190" y="258" text-anchor="middle" fill="#0A0E1A" font-family="system-ui" font-size="13" font-weight="700">100 GB total</text>
  <text x="190" y="278" text-anchor="middle" fill="#0A0E1A" font-family="system-ui" font-size="12">owned by 1 broker</text>
  <text x="190" y="370" text-anchor="middle" fill="#EF4444" font-family="system-ui" font-size="12" font-weight="700">Move broker = move 100 GB</text>

  <!-- Center 100× label -->
  <g>
    <text x="380" y="220" text-anchor="middle" fill="#A855F7" font-family="system-ui" font-size="38" font-weight="900" filter="url(#glow)">
      100×
      <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="2s" repeatCount="indefinite" additive="sum"/>
    </text>
    <text x="380" y="245" text-anchor="middle" fill="#A855F7" font-family="system-ui" font-size="11">finer</text>
  </g>

  <!-- Right: Northguard -->
  <text x="570" y="90" text-anchor="middle" fill="#14B8A6" font-family="system-ui" font-size="14" font-weight="800">NORTHGUARD</text>
  <text x="570" y="108" text-anchor="middle" fill="#94A3B8" font-family="system-ui" font-size="11">100 × 1 GB segments, short-lived</text>

  <!-- 10x10 grid -->
  <g transform="translate(430,130)">
    <!-- Row 0 -->
    <rect x="0" y="0" width="22" height="18" rx="2" fill="#14B8A6"><animate attributeName="opacity" values="0.4;1;0.4" dur="4s" begin="0.0s" repeatCount="indefinite"/></rect>
    <rect x="24" y="0" width="22" height="18" rx="2" fill="#14B8A6"><animate attributeName="opacity" values="0.4;1;0.4" dur="4s" begin="0.1s" repeatCount="indefinite"/></rect>
    <rect x="48" y="0" width="22" height="18" rx="2" fill="#14B8A6"><animate attributeName="opacity" values="0.4;1;0.4" dur="4s" begin="0.2s" repeatCount="indefinite"/></rect>
    <rect x="72" y="0" width="22" height="18" rx="2" fill="#14B8A6"><animate attributeName="opacity" values="0.4;1;0.4" dur="4s" begin="0.3s" repeatCount="indefinite"/></rect>
    <rect x="96" y="0" width="22" height="18" rx="2" fill="#14B8A6"><animate attributeName="opacity" values="0.4;1;0.4" dur="4s" begin="0.4s" repeatCount="indefinite"/></rect>
    <rect x="120" y="0" width="22" height="18" rx="2" fill="#14B8A6"><animate attributeName="opacity" values="0.4;1;0.4" dur="4s" begin="0.5s" repeatCount="indefinite"/></rect>
    <rect x="144" y="0" width="22" height="18" rx="2" fill="#14B8A6"><animate attributeName="opacity" values="0.4;1;0.4" dur="4s" begin="0.6s" repeatCount="indefinite"/></rect>
    <rect x="168" y="0" width="22" height="18" rx="2" fill="#14B8A6"><animate attributeName="opacity" values="0.4;1;0.4" dur="4s" begin="0.7s" repeatCount="indefinite"/></rect>
    <rect x="192" y="0" width="22" height="18" rx="2" fill="#14B8A6"><animate attributeName="opacity" values="0.4;1;0.4" dur="4s" begin="0.8s" repeatCount="indefinite"/></rect>
    <rect x="216" y="0" width="22" height="18" rx="2" fill="#22D3EE" stroke="#fff" stroke-width="1"><animate attributeName="opacity" values="0.5;1;0.5" dur="1.2s" repeatCount="indefinite"/></rect>
  </g>
  <!-- Rows 1-9 programmatically via nested g - but SVG doesn't have loops; write them out -->
  <g transform="translate(430,150)">
    <rect x="0" y="0" width="22" height="18" rx="2" fill="#14B8A6" opacity="0.75"/>
    <rect x="24" y="0" width="22" height="18" rx="2" fill="#14B8A6" opacity="0.75"/>
    <rect x="48" y="0" width="22" height="18" rx="2" fill="#14B8A6" opacity="0.75"/>
    <rect x="72" y="0" width="22" height="18" rx="2" fill="#14B8A6" opacity="0.75"/>
    <rect x="96" y="0" width="22" height="18" rx="2" fill="#14B8A6" opacity="0.75"/>
