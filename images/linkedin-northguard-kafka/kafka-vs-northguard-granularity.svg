    <rect x="216" y="0" width="22" height="18" rx="2" fill="#14B8A6" opacity="0.75"/>
  </g>
  <g transform="translate(430,170)" fill="#0F766E">
    <rect x="0" y="0" width="22" height="18" rx="2" opacity="0.8"/><rect x="24" y="0" width="22" height="18" rx="2" opacity="0.8"/><rect x="48" y="0" width="22" height="18" rx="2" opacity="0.8"/><rect x="72" y="0" width="22" height="18" rx="2" opacity="0.8"/><rect x="96" y="0" width="22" height="18" rx="2" opacity="0.8"/><rect x="120" y="0" width="22" height="18" rx="2" opacity="0.8"/><rect x="144" y="0" width="22" height="18" rx="2" opacity="0.8"/><rect x="168" y="0" width="22" height="18" rx="2" opacity="0.8"/><rect x="192" y="0" width="22" height="18" rx="2" opacity="0.8"/><rect x="216" y="0" width="22" height="18" rx="2" opacity="0.8"/>
  </g>
  <g transform="translate(430,190)" fill="#14B8A6">
    <rect x="0" y="0" width="22" height="18" rx="2" opacity="0.7"/><rect x="24" y="0" width="22" height="18" rx="2" opacity="0.7"/><rect x="48" y="0" width="22" height="18" rx="2" opacity="0.7"/><rect x="72" y="0" width="22" height="18" rx="2" opacity="0.7"/><rect x="96" y="0" width="22" height="18" rx="2" opacity="0.7"/><rect x="120" y="0" width="22" height="18" rx="2" opacity="0.7"/><rect x="144" y="0" width="22" height="18" rx="2" opacity="0.7"/><rect x="168" y="0" width="22" height="18" rx="2" opacity="0.7"/><rect x="192" y="0" width="22" height="18" rx="2" opacity="0.7"/><rect x="216" y="0" width="22" height="18" rx="2" opacity="0.7"/>
  </g>
  <g transform="translate(430,210)" fill="#0F766E">
    <rect x="0" y="0" width="22" height="18" rx="2" opacity="0.75"/><rect x="24" y="0" width="22" height="18" rx="2" opacity="0.75"/><rect x="48" y="0" width="22" height="18" rx="2" opacity="0.75"/><rect x="72" y="0" width="22" height="18" rx="2" opacity="0.75"/><rect x="96" y="0" width="22" height="18" rx="2" opacity="0.75"/><rect x="120" y="0" width="22" height="18" rx="2" opacity="0.75"/><rect x="144" y="0" width="22" height="18" rx="2" opacity="0.75"/><rect x="168" y="0" width="22" height="18" rx="2" opacity="0.75"/><rect x="192" y="0" width="22" height="18" rx="2" opacity="0.75"/><rect x="216" y="0" width="22" height="18" rx="2" opacity="0.75"/>
  </g>
  <g transform="translate(430,230)" fill="#14B8A6">
    <rect x="0" y="0" width="22" height="18" rx="2" opacity="0.7"/><rect x="24" y="0" width="22" height="18" rx="2" opacity="0.7"/><rect x="48" y="0" width="22" height="18" rx="2" opacity="0.7"/><rect x="72" y="0" width="22" height="18" rx="2" opacity="0.7"/><rect x="96" y="0" width="22" height="18" rx="2" opacity="0.7"/><rect x="120" y="0" width="22" height="18" rx="2" opacity="0.7"/><rect x="144" y="0" width="22" height="18" rx="2" opacity="0.7"/><rect x="168" y="0" width="22" height="18" rx="2" opacity="0.7"/><rect x="192" y="0" width="22" height="18" rx="2" opacity="0.7"/><rect x="216" y="0" width="22" height="18" rx="2" opacity="0.7"/>
  </g>
  <g transform="translate(430,250)" fill="#0F766E">
    <rect x="0" y="0" width="22" height="18" rx="2" opacity="0.8"/><rect x="24" y="0" width="22" height="18" rx="2" opacity="0.8"/><rect x="48" y="0" width="22" height="18" rx="2" opacity="0.8"/><rect x="72" y="0" width="22" height="18" rx="2" opacity="0.8"/><rect x="96" y="0" width="22" height="18" rx="2" opacity="0.8"/><rect x="120" y="0" width="22" height="18" rx="2" opacity="0.8"/><rect x="144" y="0" width="22" height="18" rx="2" opacity="0.8"/><rect x="168" y="0" width="22" height="18" rx="2" opacity="0.8"/><rect x="192" y="0" width="22" height="18" rx="2" opacity="0.8"/><rect x="216" y="0" width="22" height="18" rx="2" opacity="0.8"/>
  </g>
  <g transform="translate(430,270)" fill="#14B8A6">
    <rect x="0" y="0" width="22" height="18" rx="2" opacity="0.7"/><rect x="24" y="0" width="22" height="18" rx="2" opacity="0.7"/><rect x="48" y="0" width="22" height="18" rx="2" opacity="0.7"/><rect x="72" y="0" width="22" height="18" rx="2" opacity="0.7"/><rect x="96" y="0" width="22" height="18" rx="2" opacity="0.7"/><rect x="120" y="0" width="22" height="18" rx="2" opacity="0.7"/><rect x="144" y="0" width="22" height="18" rx="2" opacity="0.7"/><rect x="168" y="0" width="22" height="18" rx="2" opacity="0.7"/><rect x="192" y="0" width="22" height="18" rx="2" opacity="0.7"/><rect x="216" y="0" width="22" height="18" rx="2" opacity="0.7"/>
  </g>
  <g transform="translate(430,290)" fill="#0F766E">
    <rect x="0" y="0" width="22" height="18" rx="2" opacity="0.8"/><rect x="24" y="0" width="22" height="18" rx="2" opacity="0.8"/><rect x="48" y="0" width="22" height="18" rx="2" opacity="0.8"/><rect x="72" y="0" width="22" height="18" rx="2" opacity="0.8"/><rect x="96" y="0" width="22" height="18" rx="2" opacity="0.8"/><rect x="120" y="0" width="22" height="18" rx="2" opacity="0.8"/><rect x="144" y="0" width="22" height="18" rx="2" opacity="0.8"/><rect x="168" y="0" width="22" height="18" rx="2" opacity="0.8"/><rect x="192" y="0" width="22" height="18" rx="2" opacity="0.8"/><rect x="216" y="0" width="22" height="18" rx="2" opacity="0.8"/>
  </g>
  <g transform="translate(430,310)" fill="#14B8A6">
    <rect x="0" y="0" width="22" height="18" rx="2" opacity="0.7"/><rect x="24" y="0" width="22" height="18" rx="2" opacity="0.7"/><rect x="48" y="0" width="22" height="18" rx="2" opacity="0.7"/><rect x="72" y="0" width="22" height="18" rx="2" opacity="0.7"/><rect x="96" y="0" width="22" height="18" rx="2" opacity="0.7"/><rect x="120" y="0" width="22" height="18" rx="2" opacity="0.7"/><rect x="144" y="0" width="22" height="18" rx="2" opacity="0.7"/><rect x="168" y="0" width="22" height="18" rx="2" opacity="0.7"/><rect x="192" y="0" width="22" height="18" rx="2" opacity="0.7"/><rect x="216" y="0" width="22" height="18" rx="2" opacity="0.7"/>
  </g>

  <text x="570" y="348" text-anchor="middle" fill="#94A3B8" font-family="system-ui" font-size="11">1 GB each — sealed at 1 hr or 1 GB</text>
  <text x="570" y="370" text-anchor="middle" fill="#10B981" font-family="system-ui" font-size="12" font-weight="700">Move broker = assign next segment</text>

  <rect x="0" y="410" width="760" height="30" fill="#0A0E1A" opacity="0.95"/>
  <text x="380" y="429" text-anchor="middle" fill="#22D3EE" font-family="system-ui" font-size="11" font-style="italic">Smaller unit means rebalances are free, recovery is parallel, hot partitions split live.</text>
</svg>
