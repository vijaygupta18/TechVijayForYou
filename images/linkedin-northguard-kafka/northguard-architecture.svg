<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0E1A"/>
      <stop offset="100%" stop-color="#14182B"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="tealGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="760" height="440" fill="url(#bg)"/>
  <text x="380" y="26" text-anchor="middle" fill="#ffffff" font-family="system-ui" font-size="17" font-weight="800">Northguard — 4-Layer Architecture</text>
  <text x="380" y="46" text-anchor="middle" fill="#94A3B8" font-family="system-ui" font-size="12">Xinfra client → segment data plane → sharded DS-RSM metadata → fps-store</text>

  <!-- Layer 1: Client -->
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0s" fill="freeze"/>
    <rect x="70" y="64" width="80" height="36" rx="6" fill="#1E293B" stroke="#A855F7" stroke-width="1.5"/>
    <text x="110" y="86" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="12">App A</text>
    <rect x="160" y="64" width="80" height="36" rx="6" fill="#1E293B" stroke="#A855F7" stroke-width="1.5"/>
    <text x="200" y="86" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="12">App B</text>
    <rect x="250" y="64" width="80" height="36" rx="6" fill="#1E293B" stroke="#A855F7" stroke-width="1.5"/>
    <text x="290" y="86" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="12">App C</text>
    <rect x="380" y="60" width="310" height="44" rx="12" fill="url(#pill)" filter="url(#glow)"/>
    <text x="535" y="87" text-anchor="middle" fill="#0A0E1A" font-family="system-ui" font-size="14" font-weight="800">Xinfra Client (Pub/Sub-agnostic API)</text>
    <line x1="340" y1="82" x2="378" y2="82" stroke="#22D3EE" stroke-width="2"><animate attributeName="stroke-dasharray" values="0 40;40 0" dur="1.5s" repeatCount="indefinite"/></line>
  </g>

  <!-- Layer 2: Data plane - brokers with segments -->
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.5s" fill="freeze"/>
    <text x="60" y="140" fill="#94A3B8" font-family="system-ui" font-size="11" font-weight="700">DATA PLANE</text>
    <text x="60" y="155" fill="#14B8A6" font-family="system-ui" font-size="11">Segments (1 GB, 1 hr)</text>
    <!-- 4 brokers -->
    <g><rect x="180" y="130" width="110" height="56" rx="6" fill="#1F2937" stroke="#14B8A6" stroke-width="1.5"/>
       <text x="235" y="147" text-anchor="middle" fill="#94A3B8" font-family="system-ui" font-size="10">Broker 1</text>
       <rect x="190" y="154" width="28" height="22" rx="3" fill="#0F766E"/><rect x="222" y="154" width="28" height="22" rx="3" fill="#14B8A6"/><rect x="254" y="154" width="28" height="22" rx="3" fill="#22D3EE"><animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/></rect></g>
    <g><rect x="300" y="130" width="110" height="56" rx="6" fill="#1F2937" stroke="#14B8A6" stroke-width="1.5"/>
       <text x="355" y="147" text-anchor="middle" fill="#94A3B8" font-family="system-ui" font-size="10">Broker 2 (leader)</text>
       <rect x="310" y="154" width="28" height="22" rx="3" fill="#14B8A6"/><rect x="342" y="154" width="28" height="22" rx="3" fill="#22D3EE"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/></rect><rect x="374" y="154" width="28" height="22" rx="3" fill="#0F766E"/>
       <circle cx="355" cy="158" r="30" fill="url(#tealGlow)" opacity="0.5"><animate attributeName="r" values="26;34;26" dur="2s" repeatCount="indefinite"/></circle></g>
    <g><rect x="420" y="130" width="110" height="56" rx="6" fill="#1F2937" stroke="#14B8A6" stroke-width="1.5"/>
       <text x="475" y="147" text-anchor="middle" fill="#94A3B8" font-family="system-ui" font-size="10">Broker 3</text>
       <rect x="430" y="154" width="28" height="22" rx="3" fill="#22D3EE"/><rect x="462" y="154" width="28" height="22" rx="3" fill="#0F766E"/><rect x="494" y="154" width="28" height="22" rx="3" fill="#14B8A6"/></g>
    <g><rect x="540" y="130" width="110" height="56" rx="6" fill="#1F2937" stroke="#14B8A6" stroke-width="1.5"/>
       <text x="595" y="147" text-anchor="middle" fill="#94A3B8" font-family="system-ui" font-size="10">Broker 4</text>
       <rect x="550" y="154" width="28" height="22" rx="3" fill="#0F766E"/><rect x="582" y="154" width="28" height="22" rx="3" fill="#14B8A6"/><rect x="614" y="154" width="28" height="22" rx="3" fill="#22D3EE"/></g>
  </g>

  <!-- Layer 3: DS-RSM ring -->
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1s" fill="freeze"/>
    <text x="60" y="220" fill="#94A3B8" font-family="system-ui" font-size="11" font-weight="700">METADATA</text>
    <text x="60" y="235" fill="#A855F7" font-family="system-ui" font-size="11">DS-RSM — 128+ Raft shards</text>
    <g transform="translate(415,265)">
      <circle r="55" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>
      <circle cx="55" cy="0" r="9" fill="#A855F7"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" begin="0s" repeatCount="indefinite"/></circle>
      <circle cx="39" cy="-39" r="9" fill="#A855F7"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" begin="0.35s" repeatCount="indefinite"/></circle>
      <circle cx="0" cy="-55" r="9" fill="#A855F7"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" begin="0.7s" repeatCount="indefinite"/></circle>
      <circle cx="-39" cy="-39" r="9" fill="#A855F7"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" begin="1.05s" repeatCount="indefinite"/></circle>
      <circle cx="-55" cy="0" r="9" fill="#A855F7"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" begin="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="-39" cy="39" r="9" fill="#A855F7"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" begin="1.75s" repeatCount="indefinite"/></circle>
      <circle cx="0" cy="55" r="9" fill="#A855F7"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" begin="2.1s" repeatCount="indefinite"/></circle>
      <circle cx="39" cy="39" r="9" fill="#A855F7"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" begin="2.45s" repeatCount="indefinite"/></circle>
      <text x="0" y="4" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="11" font-weight="700">vnodes</text>
    </g>
    <text x="250" y="265" fill="#94A3B8" font-family="system-ui" font-size="11">Each vnode = Raft state machine</text>
    <text x="250" y="282" fill="#94A3B8" font-family="system-ui" font-size="11">Topic hash → vnode → coordinator</text>
    <text x="250" y="299" fill="#94A3B8" font-family="system-ui" font-size="11">SWIM gossip for failure detect</text>
  </g>

  <!-- Layer 4: Storage -->
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.5s" fill="freeze"/>
    <text x="60" y="355" fill="#94A3B8" font-family="system-ui" font-size="11" font-weight="700">STORAGE — fps-store</text>
    <g transform="translate(170,372)">
      <ellipse cx="0" cy="0" rx="38" ry="10" fill="#1F2937" stroke="#F59E0B" stroke-width="1.5"/>
      <path d="M -38 0 L -38 22 Q -38 32 0 32 Q 38 32 38 22 L 38 0" fill="#1F2937" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="0" y="52" text-anchor="middle" fill="#F59E0B" font-family="system-ui" font-size="10" font-weight="700">WAL</text>
    </g>
    <g transform="translate(290,372)">
      <ellipse cx="0" cy="0" rx="38" ry="10" fill="#1F2937" stroke="#14B8A6" stroke-width="1.5"/>
      <path d="M -38 0 L -38 22 Q -38 32 0 32 Q 38 32 38 22 L 38 0" fill="#1F2937" stroke="#14B8A6" stroke-width="1.5"/>
      <text x="0" y="52" text-anchor="middle" fill="#14B8A6" font-family="system-ui" font-size="10" font-weight="700">Segment files</text>
    </g>
    <g transform="translate(410,372)">
      <ellipse cx="0" cy="0" rx="38" ry="10" fill="#1F2937" stroke="#A855F7" stroke-width="1.5"/>
      <path d="M -38 0 L -38 22 Q -38 32 0 32 Q 38 32 38 22 L 38 0" fill="#1F2937" stroke="#A855F7" stroke-width="1.5"/>
      <text x="0" y="52" text-anchor="middle" fill="#A855F7" font-family="system-ui" font-size="10" font-weight="700">RocksDB idx</text>
    </g>
    <g transform="translate(530,372)">
      <ellipse cx="0" cy="0" rx="38" ry="10" fill="#1F2937" stroke="#22D3EE" stroke-width="1.5"/>
      <path d="M -38 0 L -38 22 Q -38 32 0 32 Q 38 32 38 22 L 38 0" fill="#1F2937" stroke="#22D3EE" stroke-width="1.5"/>
      <text x="0" y="52" text-anchor="middle" fill="#22D3EE" font-family="system-ui" font-size="10" font-weight="700">Direct I/O</text>
    </g>
    <!-- traveling packets -->
    <circle r="4" fill="#22D3EE" filter="url(#glow)"><animateMotion dur="3s" repeatCount="indefinite" path="M 140 372 L 620 372"/></circle>
  </g>

  <rect x="0" y="410" width="760" height="30" fill="#0A0E1A" opacity="0.95"/>
  <text x="380" y="429" text-anchor="middle" fill="#22D3EE" font-family="system-ui" font-size="11" font-style="italic">Four layers, each decoupled — the partition no longer couples ordering, replication, and parallelism.</text>
</svg>
