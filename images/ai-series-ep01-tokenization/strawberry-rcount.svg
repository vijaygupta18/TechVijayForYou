<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <defs>
    <linearGradient id="bg-rc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0618" />
      <stop offset="100%" stop-color="#140A2C" />
    </linearGradient>
    <linearGradient id="straw-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B7A" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="berry-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7B4BFF" />
      <stop offset="100%" stop-color="#B74BFF" />
    </linearGradient>
    <filter id="glow-rc" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="420" fill="url(#bg-rc)" />

  <text x="450" y="34" text-anchor="middle" fill="#fff" font-family="Montserrat, sans-serif" font-size="20" font-weight="800">Why ChatGPT Says 2 R's</text>
  <text x="450" y="56" text-anchor="middle" fill="#9080B0" font-family="Montserrat, sans-serif" font-size="13" font-weight="600">human view vs AI view</text>

  <!-- Divider -->
  <line x1="450" y1="80" x2="450" y2="380" stroke="#3A2860" stroke-width="1" stroke-dasharray="4,4" />

  <!-- LEFT: HUMAN VIEW -->
  <g>
    <text x="225" y="105" text-anchor="middle" fill="#10B981" font-family="Montserrat, sans-serif" font-size="12" font-weight="700" letter-spacing="3">YOU SEE</text>

    <!-- Letters -->
    <g font-family="JetBrains Mono, monospace" font-size="42" font-weight="800">
      <text x="60"  y="200" fill="#fff">S</text>
      <text x="92"  y="200" fill="#fff">T</text>
      <text x="124" y="200" fill="#FF4757" filter="url(#glow-rc)">R</text>
      <text x="156" y="200" fill="#fff">A</text>
      <text x="188" y="200" fill="#fff">W</text>
      <text x="222" y="200" fill="#fff">B</text>
      <text x="254" y="200" fill="#fff">E</text>
      <text x="286" y="200" fill="#FF4757" filter="url(#glow-rc)">R</text>
      <text x="318" y="200" fill="#FF4757" filter="url(#glow-rc)">R</text>
      <text x="350" y="200" fill="#fff">Y</text>
    </g>

    <!-- Counter overlay -->
    <g>
      <circle cx="135" cy="160" r="14" fill="#FF4757" opacity="0">
        <animate attributeName="opacity" values="0;1;1;1;1;1" keyTimes="0;0.15;0.4;0.7;0.95;1" dur="4s" repeatCount="indefinite" />
      </circle>
      <text x="135" y="166" text-anchor="middle" fill="#fff" font-family="Montserrat, sans-serif" font-size="14" font-weight="800" opacity="0">
        <animate attributeName="opacity" values="0;1;1;1;1;1" keyTimes="0;0.15;0.4;0.7;0.95;1" dur="4s" repeatCount="indefinite" />
        1
      </text>

      <circle cx="297" cy="160" r="14" fill="#FF4757" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;1;1" keyTimes="0;0.4;0.45;0.7;0.95;1" dur="4s" repeatCount="indefinite" />
      </circle>
      <text x="297" y="166" text-anchor="middle" fill="#fff" font-family="Montserrat, sans-serif" font-size="14" font-weight="800" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;1;1" keyTimes="0;0.4;0.45;0.7;0.95;1" dur="4s" repeatCount="indefinite" />
        2
      </text>

      <circle cx="329" cy="160" r="14" fill="#FF4757" opacity="0">
        <animate attributeName="opacity" values="0;0;0;1;1;1" keyTimes="0;0.65;0.7;0.75;0.95;1" dur="4s" repeatCount="indefinite" />
      </circle>
      <text x="329" y="166" text-anchor="middle" fill="#fff" font-family="Montserrat, sans-serif" font-size="14" font-weight="800" opacity="0">
        <animate attributeName="opacity" values="0;0;0;1;1;1" keyTimes="0;0.65;0.7;0.75;0.95;1" dur="4s" repeatCount="indefinite" />
        3
      </text>
    </g>

    <!-- Result -->
    <g transform="translate(225, 280)">
      <rect x="-90" y="0" width="180" height="50" rx="10" fill="#10B981" opacity="0.15" stroke="#10B981" stroke-width="2"/>
      <text x="0" y="32" text-anchor="middle" fill="#10B981" font-family="Montserrat, sans-serif" font-size="20" font-weight="800">3 R's ✓</text>
    </g>
    <text x="225" y="360" text-anchor="middle" fill="#7CB89C" font-family="Montserrat, sans-serif" font-size="12" font-weight="600">letters are visible · easy to count</text>
  </g>

  <!-- RIGHT: AI VIEW -->
  <g>
    <text x="675" y="105" text-anchor="middle" fill="#FF4757" font-family="Montserrat, sans-serif" font-size="12" font-weight="700" letter-spacing="3">AI SEES</text>

    <!-- Token blocks -->
    <g>
      <rect x="510" y="160" width="130" height="60" rx="10" fill="url(#straw-grad)">
        <animate attributeName="y" values="160;156;160" dur="2.5s" repeatCount="indefinite" />
      </rect>
      <text x="575" y="200" text-anchor="middle" fill="#fff" font-family="JetBrains Mono, monospace" font-size="22" font-weight="800">STRAW</text>

      <rect x="660" y="160" width="130" height="60" rx="10" fill="url(#berry-grad)">
        <animate attributeName="y" values="160;164;160" dur="2.5s" repeatCount="indefinite" />
      </rect>
      <text x="725" y="200" text-anchor="middle" fill="#fff" font-family="JetBrains Mono, monospace" font-size="22" font-weight="800">BERRY</text>
    </g>

    <!-- Token IDs -->
    <text x="575" y="240" text-anchor="middle" fill="#FF8FA1" font-family="JetBrains Mono, monospace" font-size="11" opacity="0.8">id: 125634</text>
    <text x="725" y="240" text-anchor="middle" fill="#C99CFF" font-family="JetBrains Mono, monospace" font-size="11" opacity="0.8">id: 51240</text>

    <!-- Letters hidden inside -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;0.4;0.4;0" keyTimes="0;0.3;0.5;0.85;1" dur="4s" repeatCount="indefinite" />
      <text x="575" y="190" text-anchor="middle" fill="#fff" font-family="JetBrains Mono, monospace" font-size="10" font-weight="500">[r hidden inside]</text>
      <text x="725" y="190" text-anchor="middle" fill="#fff" font-family="JetBrains Mono, monospace" font-size="10" font-weight="500">[r,r hidden inside]</text>
    </g>

    <!-- Result -->
    <g transform="translate(675, 280)">
      <rect x="-90" y="0" width="180" height="50" rx="10" fill="#FF4757" opacity="0.15" stroke="#FF4757" stroke-width="2"/>
      <text x="0" y="32" text-anchor="middle" fill="#FF4757" font-family="Montserrat, sans-serif" font-size="20" font-weight="800">2 R's ✗</text>
    </g>
    <text x="675" y="360" text-anchor="middle" fill="#FF8FA1" font-family="Montserrat, sans-serif" font-size="12" font-weight="600">letters hidden inside chunks · guessed from memory</text>
  </g>

  <!-- Bottom takeaway -->
  <text x="450" y="402" text-anchor="middle" fill="#9080B0" font-family="Montserrat, sans-serif" font-size="13" font-weight="700">it's not a reasoning bug · it's a perception bug</text>
</svg>
