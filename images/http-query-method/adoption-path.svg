<?xml version="1.0" encoding="UTF-8"?>
<svg width="820" height="380" viewBox="0 0 820 380" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-labelledby="title desc">
  <title id="title">Why You Can't Use QUERY Everywhere Yet</title>
  <desc id="desc">A request pipeline from Client to Origin Server. Client, Proxy, CDN, Framework and Origin Server understand the new HTTP QUERY method and glow green. A WAF / Firewall with a method allowlist does not recognize QUERY, turns red, and rejects it, breaking the chain. A cyan packet travels from Client through Proxy and stops at the WAF, flashing red. Caption: adoption takes years, like PATCH did, so keep a POST fallback.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E1A"/>
      <stop offset="100%" stop-color="#14182B"/>
    </linearGradient>

    <linearGradient id="nodeFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#20263F"/>
      <stop offset="100%" stop-color="#161A2E"/>
    </linearGradient>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowStrong" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00FF85"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5170"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="820" height="380" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="410" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Why You Can't Use QUERY Everywhere Yet</text>
  <!-- Subtitle -->
  <text x="410" y="49" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8B93A7">Every hop must understand the method — one allowlist breaks the chain</text>

  <!-- CDN callout (near CDN node) -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="469" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#FFD93D">CDNs (Cloudflare, Akamai co-authored)</text>
    <text x="469" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#FFD93D">will support it early</text>
    <line x1="469" y1="92" x2="469" y2="116" stroke="#FFD93D" stroke-width="1.5" stroke-dasharray="2,2"/>
  </g>

  <!-- ===================== PIPELINE ===================== -->
  <g id="pipeline">

    <!-- Arrows (revealed left to right). After the WAF, the chain never actually receives the request, so those links are dashed / grey. -->
    <g id="arrows">
      <line x1="167.5" y1="148" x2="185" y2="148" stroke="#00FF85" stroke-width="2" marker-end="url(#arrowGreen)" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.4s" fill="freeze"/>
      </line>
      <line x1="284.5" y1="148" x2="302" y2="148" stroke="#00FF85" stroke-width="2" marker-end="url(#arrowGreen)" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="0.45s" dur="0.4s" fill="freeze"/>
      </line>
      <line x1="401.5" y1="148" x2="419" y2="148" stroke="#4A5170" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowGrey)" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="0.75s" dur="0.4s" fill="freeze"/>
      </line>
      <line x1="518.5" y1="148" x2="536" y2="148" stroke="#4A5170" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowGrey)" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="1.05s" dur="0.4s" fill="freeze"/>
      </line>
      <line x1="635.5" y1="148" x2="653" y2="148" stroke="#4A5170" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowGrey)" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="1.35s" dur="0.4s" fill="freeze"/>
      </line>
    </g>

    <!-- Node: Client (supports QUERY) -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.5s" fill="freeze"/>
      <rect x="70.5" y="118" width="95" height="60" rx="10" fill="url(#nodeFill)" stroke="#00FF85" stroke-width="1.5" filter="url(#glow)">
        <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2.2s" begin="0.5s" repeatCount="indefinite"/>
      </rect>
      <text x="118" y="146" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Client</text>
      <text x="118" y="162" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#8B93A7">originates request</text>
      <text x="118" y="196" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#00FF85">✓ supports QUERY</text>
      <circle cx="155.5" cy="128" r="9" fill="#0F1424" stroke="#00FF85" stroke-width="1.5"/>
      <path d="M151.5,128 L154.5,131.5 L160,124.5" fill="none" stroke="#00FF85" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Node: Proxy (supports QUERY) -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
      <rect x="187.5" y="118" width="95" height="60" rx="10" fill="url(#nodeFill)" stroke="#00FF85" stroke-width="1.5" filter="url(#glow)">
        <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2.2s" begin="0.8s" repeatCount="indefinite"/>
      </rect>
      <text x="235" y="146" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Proxy</text>
      <text x="235" y="162" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#8B93A7">passes it through</text>
      <text x="235" y="196" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#00FF85">✓ supports QUERY</text>
      <circle cx="272.5" cy="128" r="9" fill="#0F1424" stroke="#00FF85" stroke-width="1.5"/>
      <path d="M268.5,128 L271.5,131.5 L277,124.5" fill="none" stroke="#00FF85" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Node: WAF / Firewall (BLOCKS - method allowlist) -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.5s" fill="freeze"/>
      <rect x="304.5" y="118" width="95" height="60" rx="10" fill="url(#nodeFill)" stroke="#FF5252" stroke-width="2" filter="url(#glowStrong)">
        <animate attributeName="stroke-opacity" values="0.55;1;0.55" dur="1.1s" begin="1.1s" repeatCount="indefinite"/>
        <animate attributeName="stroke-width" values="2;3;2" dur="1.1s" begin="1.1s" repeatCount="indefinite"/>
      </rect>
      <text x="352" y="140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">WAF /</text>
      <text x="352" y="155" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Firewall</text>
      <text x="352" y="196" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#8B93A7">method allowlist</text>
      <text x="352" y="212" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="800" fill="#FF5252">✕ unknown method → rejected</text>
      <circle cx="389.5" cy="128" r="9" fill="#0F1424" stroke="#FF5252" stroke-width="1.5"/>
      <path d="M385.5,124 L393.5,132 M393.5,124 L385.5,132" stroke="#FF5252" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Node: CDN (supports QUERY, gold accent = early adopter) -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.5s" fill="freeze"/>
      <rect x="421.5" y="118" width="95" height="60" rx="10" fill="url(#nodeFill)" stroke="#FFD93D" stroke-width="1.5" filter="url(#glow)">
        <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2.2s" begin="1.4s" repeatCount="indefinite"/>
      </rect>
      <text x="469" y="146" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">CDN</text>
      <text x="469" y="162" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#8B93A7">edge cache layer</text>
      <text x="469" y="196" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#00FF85">✓ supports QUERY</text>
      <circle cx="506.5" cy="128" r="9" fill="#0F1424" stroke="#00FF85" stroke-width="1.5"/>
      <path d="M502.5,128 L505.5,131.5 L511,124.5" fill="none" stroke="#00FF85" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Node: Framework (supports QUERY) -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.5s" fill="freeze"/>
      <rect x="538.5" y="118" width="95" height="60" rx="10" fill="url(#nodeFill)" stroke="#00FF85" stroke-width="1.5" filter="url(#glow)">
        <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2.2s" begin="1.7s" repeatCount="indefinite"/>
      </rect>
      <text x="586" y="146" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Framework</text>
      <text x="586" y="162" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#8B93A7">routes the request</text>
      <text x="586" y="196" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#00FF85">✓ supports QUERY</text>
      <circle cx="623.5" cy="128" r="9" fill="#0F1424" stroke="#00FF85" stroke-width="1.5"/>
      <path d="M619.5,128 L622.5,131.5 L628,124.5" fill="none" stroke="#00FF85" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Node: Origin Server (supports QUERY) -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.5s" fill="freeze"/>
      <rect x="655.5" y="118" width="95" height="60" rx="10" fill="url(#nodeFill)" stroke="#00FF85" stroke-width="1.5" filter="url(#glow)">
        <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2.2s" begin="2.0s" repeatCount="indefinite"/>
      </rect>
      <text x="703" y="140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Origin</text>
      <text x="703" y="155" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Server</text>
      <text x="703" y="196" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#00FF85">✓ supports QUERY</text>
      <circle cx="740.5" cy="128" r="9" fill="#0F1424" stroke="#00FF85" stroke-width="1.5"/>
      <path d="M736.5,128 L739.5,131.5 L745,124.5" fill="none" stroke="#00FF85" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Traveling QUERY packet: moves Client -> Proxy -> WAF, then flashes red and stops -->
    <g>
      <circle r="8" fill="#4FC3F7" filter="url(#glowStrong)" opacity="0">
        <animateMotion path="M118,148 L352,148" keyPoints="0;1;1" keyTimes="0;0.4;1" calcMode="linear" dur="5.5s" begin="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;1;1;0;0" keyTimes="0;0.4;0.5;0.52;1" dur="5.5s" begin="2s" repeatCount="indefinite"/>
        <animate attributeName="fill" values="#4FC3F7;#4FC3F7;#FF5252;#FF5252;#FF5252" keyTimes="0;0.38;0.4;0.5;1" dur="5.5s" begin="2s" repeatCount="indefinite"/>
        <animate attributeName="r" values="8;8;11;8;8" keyTimes="0;0.38;0.4;0.46;1" dur="5.5s" begin="2s" repeatCount="indefinite"/>
      </circle>
      <text x="352" y="103" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#4FC3F7" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.36;0.4;0.5;0.55;1" dur="5.5s" begin="2s" repeatCount="indefinite"/>
        QUERY
      </text>
    </g>
  </g>

  <!-- Legend -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="11">
    <circle cx="150" cy="246" r="6" fill="#00FF85"/>
    <text x="164" y="250" fill="#C7CCDA">Understands QUERY</text>

    <circle cx="345" cy="246" r="6" fill="#FF5252"/>
    <text x="359" y="250" fill="#C7CCDA">Blocks unknown methods</text>

    <circle cx="565" cy="246" r="6" fill="#FFD93D"/>
    <text x="579" y="250" fill="#C7CCDA">CDN — early adopter</text>
  </g>

  <line x1="70" y1="270" x2="750" y2="270" stroke="#232A45" stroke-width="1"/>

  <!-- Bottom key message -->
  <text x="410" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">Adoption takes years — like PATCH did. Keep a POST fallback.</text>

  <!-- Caption -->
  <text x="410" y="365" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8B93A7">Proposed Standard, June 2026 — adopt progressively behind a POST fallback</text>
</svg>
