<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0E1A"/>
      <stop offset="100%" stop-color="#14182B"/>
    </linearGradient>
    <radialGradient id="pktGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="460" fill="url(#bg)"/>

  <text x="400" y="32" text-anchor="middle" fill="#fff" font-family="Montserrat,sans-serif" font-size="20" font-weight="800">End-to-End Scan Flow</text>
  <text x="400" y="56" text-anchor="middle" fill="#8B9BB8" font-family="Montserrat,sans-serif" font-size="13">Camera → decoded UPI payload in ~40ms</text>

  <!-- 6 stage nodes in a flowing S-curve -->
  <!-- Stage 1: Camera -->
  <g transform="translate(60 140)">
    <rect x="0" y="0" width="120" height="80" fill="#14182B" stroke="#00D4FF" stroke-width="2" rx="10"/>
    <text x="60" y="32" text-anchor="middle" fill="#00D4FF" font-family="Montserrat,sans-serif" font-size="13" font-weight="700">1. CAMERA</text>
    <text x="60" y="52" text-anchor="middle" fill="#E8EEF7" font-family="Montserrat,sans-serif" font-size="10">Frame capture</text>
    <text x="60" y="66" text-anchor="middle" fill="#8B9BB8" font-family="Montserrat,sans-serif" font-size="9">~5ms</text>
  </g>

  <!-- Stage 2: Binarize -->
  <g transform="translate(220 140)">
    <rect x="0" y="0" width="120" height="80" fill="#14182B" stroke="#A855F7" stroke-width="2" rx="10"/>
    <text x="60" y="32" text-anchor="middle" fill="#A855F7" font-family="Montserrat,sans-serif" font-size="13" font-weight="700">2. BINARIZE</text>
    <text x="60" y="52" text-anchor="middle" fill="#E8EEF7" font-family="Montserrat,sans-serif" font-size="10">Otsu threshold</text>
    <text x="60" y="66" text-anchor="middle" fill="#8B9BB8" font-family="Montserrat,sans-serif" font-size="9">~5ms</text>
  </g>

  <!-- Stage 3: Find 1:1:3:1:1 -->
  <g transform="translate(380 140)">
    <rect x="0" y="0" width="140" height="80" fill="#14182B" stroke="#FFD447" stroke-width="2" rx="10"/>
    <text x="70" y="32" text-anchor="middle" fill="#FFD447" font-family="Montserrat,sans-serif" font-size="13" font-weight="700">3. FIND 1:1:3:1:1</text>
    <text x="70" y="52" text-anchor="middle" fill="#E8EEF7" font-family="Montserrat,sans-serif" font-size="10">Locate + orient</text>
    <text x="70" y="66" text-anchor="middle" fill="#8B9BB8" font-family="Montserrat,sans-serif" font-size="9">~10ms</text>
  </g>

  <!-- Stage 4: Perspective correct -->
  <g transform="translate(560 140)">
    <rect x="0" y="0" width="140" height="80" fill="#14182B" stroke="#FF6B35" stroke-width="2" rx="10"/>
    <text x="70" y="32" text-anchor="middle" fill="#FF6B35" font-family="Montserrat,sans-serif" font-size="13" font-weight="700">4. UN-WARP</text>
    <text x="70" y="52" text-anchor="middle" fill="#E8EEF7" font-family="Montserrat,sans-serif" font-size="10">Alignment + homography</text>
    <text x="70" y="66" text-anchor="middle" fill="#8B9BB8" font-family="Montserrat,sans-serif" font-size="9">~7ms</text>
  </g>

  <!-- Second row -->
  <!-- Stage 5: Unmask XOR -->
  <g transform="translate(560 260)">
    <rect x="0" y="0" width="140" height="80" fill="#14182B" stroke="#10B981" stroke-width="2" rx="10"/>
    <text x="70" y="32" text-anchor="middle" fill="#10B981" font-family="Montserrat,sans-serif" font-size="13" font-weight="700">5. UNMASK</text>
    <text x="70" y="52" text-anchor="middle" fill="#E8EEF7" font-family="Montserrat,sans-serif" font-size="10">Read format, XOR</text>
    <text x="70" y="66" text-anchor="middle" fill="#8B9BB8" font-family="Montserrat,sans-serif" font-size="9">~2ms</text>
  </g>

  <!-- Stage 6: Reed-Solomon decode -->
  <g transform="translate(380 260)">
    <rect x="0" y="0" width="140" height="80" fill="#14182B" stroke="#F43F5E" stroke-width="2" rx="10"/>
    <text x="70" y="32" text-anchor="middle" fill="#F43F5E" font-family="Montserrat,sans-serif" font-size="13" font-weight="700">6. REED-SOLOMON</text>
    <text x="70" y="52" text-anchor="middle" fill="#E8EEF7" font-family="Montserrat,sans-serif" font-size="10">Error correct</text>
    <text x="70" y="66" text-anchor="middle" fill="#8B9BB8" font-family="Montserrat,sans-serif" font-size="9">~5ms</text>
  </g>

  <!-- Stage 7: Payload -->
  <g transform="translate(200 260)">
    <rect x="0" y="0" width="160" height="80" fill="#14182B" stroke="#00D4FF" stroke-width="2" rx="10"/>
    <text x="80" y="30" text-anchor="middle" fill="#00D4FF" font-family="Montserrat,sans-serif" font-size="13" font-weight="700">7. UPI PAYLOAD</text>
    <text x="80" y="50" text-anchor="middle" fill="#E8EEF7" font-family="Montserrat,sans-serif" font-size="9">upi://pay?pa=...&amp;am=</text>
    <text x="80" y="66" text-anchor="middle" fill="#8B9BB8" font-family="Montserrat,sans-serif" font-size="9">~3ms</text>
  </g>

  <!-- Stage 8: UPI app -->
  <g transform="translate(40 260)">
    <rect x="0" y="0" width="140" height="80" fill="#14182B" stroke="#10B981" stroke-width="2.5" rx="10" filter="url(#soft)"/>
    <text x="70" y="32" text-anchor="middle" fill="#10B981" font-family="Montserrat,sans-serif" font-size="13" font-weight="800">8. UPI APP</text>
    <text x="70" y="52" text-anchor="middle" fill="#E8EEF7" font-family="Montserrat,sans-serif" font-size="10">Deep-link opens</text>
    <text x="70" y="66" text-anchor="middle" fill="#8B9BB8" font-family="Montserrat,sans-serif" font-size="9">Payment screen</text>
  </g>

  <!-- Connector paths -->
  <g fill="none" stroke="#2A334A" stroke-width="2" stroke-dasharray="4 4">
    <!-- top row -->
    <path d="M 180 180 L 220 180"/>
    <path d="M 340 180 L 380 180"/>
    <path d="M 520 180 L 560 180"/>
    <!-- right turn down -->
    <path d="M 630 220 L 630 260"/>
    <!-- bottom row right to left -->
    <path d="M 560 300 L 520 300"/>
    <path d="M 380 300 L 360 300"/>
    <path d="M 200 300 L 180 300"/>
  </g>

  <!-- Traveling packet along full S-path -->
  <circle r="10" fill="url(#pktGlow)" filter="url(#soft)">
    <animateMotion dur="5s" repeatCount="indefinite" path="M 120 180 L 280 180 L 450 180 L 630 180 L 630 300 L 450 300 L 280 300 L 110 300"/>
  </circle>
  <circle r="5" fill="#00D4FF">
    <animateMotion dur="5s" repeatCount="indefinite" path="M 120 180 L 280 180 L 450 180 L 630 180 L 630 300 L 450 300 L 280 300 L 110 300"/>
  </circle>

  <!-- Total time bubble -->
  <g transform="translate(320 380)">
    <rect x="0" y="0" width="160" height="46" fill="#10B981" opacity="0.15" rx="23"/>
    <rect x="0" y="0" width="160" height="46" fill="none" stroke="#10B981" stroke-width="2" rx="23"/>
    <text x="80" y="30" text-anchor="middle" fill="#10B981" font-family="Montserrat,sans-serif" font-size="16" font-weight="800">TOTAL: ~40ms</text>
  </g>

  <text x="400" y="444" text-anchor="middle" fill="#8B9BB8" font-family="Montserrat,sans-serif" font-size="11">From pixel to payment screen: 8 stages, ~40ms total on a modern phone.</text>
</svg>
