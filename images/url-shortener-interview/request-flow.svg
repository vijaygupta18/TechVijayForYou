<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0E1A"/>
      <stop offset="100%" stop-color="#14182B"/>
    </linearGradient>
    <filter id="g3"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="860" height="360" fill="url(#bg3)"/>
  <text x="430" y="32" text-anchor="middle" fill="#fff" font-size="20" font-weight="800">Read Path — /abc1234 → 301 redirect (target: &lt; 50ms p99)</text>

  <!-- Pipeline boxes -->
  <g font-family="sans-serif">
    <rect x="30"  y="140" width="100" height="60" rx="8" fill="#1a2340" stroke="#4FC3F7"/>
    <text x="80"  y="165" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">Client</text>
    <text x="80"  y="182" text-anchor="middle" fill="#8aa0c8" font-size="9">browser click</text>

    <rect x="160" y="140" width="100" height="60" rx="8" fill="#1a2340" stroke="#4FC3F7"/>
    <text x="210" y="165" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">Load Balancer</text>
    <text x="210" y="182" text-anchor="middle" fill="#8aa0c8" font-size="9">1 ms</text>

    <rect x="290" y="140" width="100" height="60" rx="8" fill="#221a14" stroke="#FFB74D"/>
    <text x="340" y="165" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">Rate Limiter</text>
    <text x="340" y="182" text-anchor="middle" fill="#8aa0c8" font-size="9">1 ms</text>

    <rect x="420" y="140" width="100" height="60" rx="8" fill="#141f1a" stroke="#81C784"/>
    <text x="470" y="165" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">App Server</text>
    <text x="470" y="182" text-anchor="middle" fill="#8aa0c8" font-size="9">routing</text>

    <!-- Cache branch -->
    <rect x="550" y="60" width="130" height="60" rx="8" fill="#2a1e1e" stroke="#FF5252" stroke-width="2"/>
    <text x="615" y="85" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">Redis Cache</text>
    <text x="615" y="102" text-anchor="middle" fill="#FF5252" font-size="10" font-weight="700">80% HIT · 1ms</text>

    <!-- DB branch -->
    <rect x="550" y="220" width="130" height="60" rx="8" fill="#2a1e2f" stroke="#EC407A" stroke-width="2"/>
    <text x="615" y="245" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">Cassandra</text>
    <text x="615" y="262" text-anchor="middle" fill="#EC407A" font-size="10">20% miss · 3ms</text>

    <!-- Response -->
    <rect x="710" y="140" width="120" height="60" rx="8" fill="#141f1a" stroke="#00FF85" stroke-width="2"/>
    <text x="770" y="165" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">301 Redirect</text>
    <text x="770" y="182" text-anchor="middle" fill="#00FF85" font-size="10" font-weight="700">→ long URL</text>
  </g>

  <!-- Arrows along the main pipeline -->
  <g stroke="#4FC3F7" stroke-width="2" fill="none">
    <line x1="130" y1="170" x2="160" y2="170"/>
    <line x1="260" y1="170" x2="290" y2="170"/>
    <line x1="390" y1="170" x2="420" y2="170"/>
    <line x1="520" y1="160" x2="550" y2="110" stroke="#FF5252"/>
    <line x1="520" y1="180" x2="550" y2="240" stroke="#EC407A"/>
    <line x1="680" y1="90" x2="710" y2="160" stroke="#FF5252"/>
    <line x1="680" y1="240" x2="710" y2="180" stroke="#EC407A"/>
  </g>

  <!-- Packet: cache-hit path -->
  <g>
    <circle r="8" fill="#00FF85" opacity="0.35">
      <animateMotion dur="3s" repeatCount="indefinite" path="M80 170 L210 170 L340 170 L470 170 L615 90 L770 170"/>
    </circle>
    <circle r="4" fill="#00FF85">
      <animateMotion dur="3s" repeatCount="indefinite" path="M80 170 L210 170 L340 170 L470 170 L615 90 L770 170"/>
    </circle>
  </g>

  <!-- Packet: cache-miss path (slower, rarer) -->
  <g>
    <circle r="4" fill="#EC407A">
      <animateMotion dur="4.5s" begin="1.5s" repeatCount="indefinite" path="M80 170 L210 170 L340 170 L470 170 L615 250 L615 90 L770 170"/>
    </circle>
  </g>

  <!-- Side annotation: async analytics -->
  <g transform="translate(420, 300)">
    <text x="0" y="0" fill="#B74BFF" font-size="11" font-weight="700">+ fire-and-forget Kafka event (does NOT block redirect)</text>
    <text x="0" y="16" fill="#8aa0c8" font-size="10">App server produces {short_code, ts, ip, ua} → Kafka → Analytics Consumer → ClickHouse</text>
  </g>

  <!-- Latency total -->
  <g transform="translate(60, 60)">
    <rect width="280" height="46" rx="6" fill="#141a2a" stroke="#4FC3F7" stroke-width="1"/>
    <text x="10" y="20" fill="#fff" font-size="11" font-weight="700">Latency budget (p99 &lt; 50ms)</text>
    <text x="10" y="38" fill="#00FF85" font-size="11" font-family="monospace">1 + 1 + 1 + 1 = 4 ms   (cache hit path)</text>
  </g>
</svg>
