<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0E1A"/>
      <stop offset="100%" stop-color="#14182B"/>
    </linearGradient>
    <linearGradient id="scoreGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00FF85"/>
    </linearGradient>
    <linearGradient id="promptCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2235"/>
      <stop offset="100%" stop-color="#121826"/>
    </linearGradient>
    <radialGradient id="packetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>

  <text x="360" y="28" text-anchor="middle" fill="#fff" font-size="18" font-weight="800" font-family="sans-serif">THE EVALS HARNESS — 3 FEEDS, 1 VERDICT</text>
  <text x="360" y="50" text-anchor="middle" fill="#9BA5B7" font-size="13" font-family="sans-serif">The #1 AI-engineer skill — per Hamel Husain &amp; Shreya Shankar</text>

  <!-- Center: PROMPT UNDER TEST card -->
  <g>
    <rect x="280" y="140" width="180" height="100" rx="8" fill="url(#promptCard)" stroke="#00E5FF" stroke-width="2"/>
    <rect x="280" y="140" width="180" height="100" rx="8" fill="none" stroke="#00E5FF" stroke-width="2" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="2;4;2" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="370" y="170" text-anchor="middle" fill="#fff" font-size="12" font-weight="800" font-family="sans-serif">PROMPT</text>
    <text x="370" y="190" text-anchor="middle" fill="#fff" font-size="12" font-weight="800" font-family="sans-serif">UNDER TEST</text>
    <text x="370" y="215" text-anchor="middle" fill="#00E5FF" font-size="10" font-family="monospace">system + user + schema</text>
  </g>

  <!-- Connection lines from feeds to prompt -->
  <line x1="185" y1="115" x2="280" y2="160" stroke="#2A3550" stroke-width="1.5"/>
  <line x1="185" y1="190" x2="280" y2="190" stroke="#2A3550" stroke-width="1.5"/>
  <line x1="185" y1="280" x2="280" y2="220" stroke="#2A3550" stroke-width="1.5"/>

  <!-- TOP-LEFT: GOLDEN DATASET -->
  <g>
    <rect x="35" y="82" width="150" height="66" rx="6" fill="#1F2010" stroke="#FFB800" stroke-width="1.5"/>
    <text x="110" y="102" text-anchor="middle" fill="#FFB800" font-size="11" font-weight="800" font-family="sans-serif">GOLDEN DATASET</text>
    <!-- Rows -->
    <rect x="48" y="110" width="124" height="8" rx="2" fill="#332A14" stroke="#FFB800" stroke-width="0.5">
      <animate attributeName="fill" values="#FFB800;#332A14;#332A14;#332A14" keyTimes="0;0.1;0.2;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="48" y="122" width="124" height="8" rx="2" fill="#332A14" stroke="#FFB800" stroke-width="0.5">
      <animate attributeName="fill" values="#332A14;#FFB800;#332A14;#332A14" keyTimes="0.1;0.2;0.3;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="48" y="134" width="124" height="8" rx="2" fill="#332A14" stroke="#FFB800" stroke-width="0.5">
      <animate attributeName="fill" values="#332A14;#332A14;#FFB800;#332A14;#332A14" keyTimes="0.2;0.3;0.4;0.5;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Flying row packet from golden to prompt -->
  <g>
    <circle cx="0" cy="0" r="8" fill="url(#packetGlow)"/>
    <circle cx="0" cy="0" r="4" fill="#FFB800"/>
    <animateMotion dur="6s" repeatCount="indefinite" path="M 185 120 L 280 160"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.1;0.3;0.35;1" dur="6s" repeatCount="indefinite"/>
  </g>

  <!-- MIDDLE-LEFT: LLM-AS-JUDGE -->
  <g>
    <rect x="35" y="160" width="150" height="66" rx="6" fill="#20162B" stroke="#B74BFF" stroke-width="1.5"/>
    <text x="110" y="182" text-anchor="middle" fill="#B74BFF" font-size="11" font-weight="800" font-family="sans-serif">LLM-AS-JUDGE</text>
    <!-- Judge scale icon -->
    <circle cx="85" cy="205" r="8" fill="none" stroke="#B74BFF" stroke-width="1.5"/>
    <line x1="77" y1="205" x2="93" y2="205" stroke="#B74BFF" stroke-width="1.5"/>
    <line x1="85" y1="197" x2="85" y2="213" stroke="#B74BFF" stroke-width="1.5"/>
    <!-- Verdicts cycling -->
    <text x="135" y="210" text-anchor="middle" font-size="16" font-weight="800" font-family="sans-serif">
      <animate attributeName="fill" values="#00FF85;#FF4166;#00FF85;#FF4166" keyTimes="0;0.25;0.5;0.75" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1;0;1" keyTimes="0;0.2;0.4;0.6;1" dur="6s" repeatCount="indefinite"/>
      ✓
    </text>
    <text x="155" y="210" text-anchor="middle" font-size="16" font-weight="800" fill="#FF4166" font-family="sans-serif" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0;1;0" keyTimes="0;0.2;0.3;0.4;0.6;0.7;1" dur="6s" repeatCount="indefinite"/>
      ✗
    </text>
  </g>

  <!-- BOTTOM-LEFT: REGRESSION SUITE -->
  <g>
    <rect x="35" y="242" width="150" height="66" rx="6" fill="#10202B" stroke="#4FC3F7" stroke-width="1.5"/>
    <text x="110" y="262" text-anchor="middle" fill="#4FC3F7" font-size="11" font-weight="800" font-family="sans-serif">REGRESSION SUITE</text>
    <text x="110" y="278" text-anchor="middle" fill="#9BA5B7" font-size="9" font-family="sans-serif">CI pipeline</text>
    <!-- pass/fail counter -->
    <text x="70" y="298" text-anchor="middle" fill="#00FF85" font-size="11" font-weight="800" font-family="monospace">
      <animate attributeName="fill" values="#00FF85;#00FF85" dur="6s" repeatCount="indefinite"/>
      PASS 142
    </text>
    <text x="150" y="298" text-anchor="middle" fill="#FF4166" font-size="11" font-weight="800" font-family="monospace">
      FAIL 8
    </text>
  </g>

  <!-- Right side: SCORE BAR -->
  <g>
    <text x="600" y="165" text-anchor="middle" fill="#9BA5B7" font-size="11" font-weight="700" font-family="sans-serif">EVAL SCORE</text>
    <rect x="490" y="175" width="220" height="24" rx="12" fill="#0F1826" stroke="#2A3550" stroke-width="1"/>
    <rect x="490" y="175" width="0" height="24" rx="12" fill="url(#scoreGrad)">
      <animate attributeName="width" values="0;192;192;0" keyTimes="0;0.7;0.9;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <!-- Percent text counting up -->
    <text x="600" y="192" text-anchor="middle" fill="#fff" font-size="13" font-weight="800" font-family="monospace">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.9;1" dur="6s" repeatCount="indefinite"/>
      <tspan>
        <animate attributeName="fill" values="#fff;#fff" dur="6s" repeatCount="indefinite"/>
      </tspan>
    </text>
    <text x="600" y="194" text-anchor="middle" fill="#0A0E1A" font-size="13" font-weight="800" font-family="monospace">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.4;0.9;0.95;1" dur="6s" repeatCount="indefinite"/>
      87%
    </text>

    <!-- FAIL ticker below -->
    <text x="600" y="230" text-anchor="middle" fill="#9BA5B7" font-size="11" font-weight="700" font-family="sans-serif">ERROR TAXONOMY</text>
    <!-- Error clusters -->
    <g>
      <rect x="500" y="240" width="60" height="22" rx="4" fill="#2B0F18" stroke="#FF4166" stroke-width="1">
        <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.4;1" dur="6s" repeatCount="indefinite"/>
      </rect>
      <text x="530" y="255" text-anchor="middle" fill="#FF4166" font-size="9" font-weight="700" font-family="sans-serif">halluc. 3</text>
    </g>
    <g>
      <rect x="570" y="240" width="60" height="22" rx="4" fill="#2B0F18" stroke="#FF4166" stroke-width="1">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.55;1" dur="6s" repeatCount="indefinite"/>
      </rect>
      <text x="600" y="255" text-anchor="middle" fill="#FF4166" font-size="9" font-weight="700" font-family="sans-serif">fmt. 4</text>
    </g>
    <g>
      <rect x="640" y="240" width="60" height="22" rx="4" fill="#2B0F18" stroke="#FF4166" stroke-width="1">
        <animate attributeName="opacity" values="0;0;0;1;1" keyTimes="0;0.6;0.65;0.7;1" dur="6s" repeatCount="indefinite"/>
      </rect>
      <text x="670" y="255" text-anchor="middle" fill="#FF4166" font-size="9" font-weight="700" font-family="sans-serif">tone 1</text>
    </g>

    <!-- Small failure orbs spawning -->
    <circle cx="520" cy="280" r="3" fill="#FF4166">
      <animate attributeName="cy" values="280;310;280" keyTimes="0;0.5;1" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="580" cy="280" r="3" fill="#FF4166">
      <animate attributeName="cy" values="280;310;280" keyTimes="0;0.5;1" dur="2.3s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="2.3s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="640" cy="280" r="3" fill="#FF4166">
      <animate attributeName="cy" values="280;310;280" keyTimes="0;0.5;1" dur="2.5s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="2.5s" repeatCount="indefinite" begin="1s"/>
    </circle>
  </g>

  <!-- Caption strip -->
  <rect x="0" y="374" width="720" height="26" fill="#000" opacity="0.4"/>
  <text x="360" y="391" text-anchor="middle" fill="#9BA5B7" font-size="11" font-family="sans-serif">Evals = unit tests for prompts. The #1 skill in 2026.</text>
</svg>
