<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220">
  <defs>
    <linearGradient id="bgPipe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0E1A" />
      <stop offset="100%" stop-color="#14182B" />
    </linearGradient>
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF85" stop-opacity="1" />
      <stop offset="60%" stop-color="#00FF85" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00FF85" stop-opacity="0" />
    </radialGradient>
    <filter id="boxGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="220" fill="url(#bgPipe)" />

  <!-- Pipeline track -->
  <line x1="60" y1="110" x2="740" y2="110" stroke="#1E2438" stroke-width="3" stroke-dasharray="6 6" />

  <!-- Component boxes -->
  <!-- App -->
  <g transform="translate(40, 80)">
    <rect width="100" height="60" rx="10" fill="#181B2C" stroke="#38BDF8" stroke-width="2" />
    <text x="50" y="28" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="14" font-weight="700">APP</text>
    <text x="50" y="46" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="11">:9999</text>
  </g>

  <!-- vmagent -->
  <g transform="translate(180, 80)">
    <rect width="100" height="60" rx="10" fill="#181B2C" stroke="#F59E0B" stroke-width="2" />
    <text x="50" y="28" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="14" font-weight="700">vmagent</text>
    <text x="50" y="46" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="10">scrape</text>
  </g>

  <!-- vminsert -->
  <g transform="translate(320, 80)">
    <rect width="100" height="60" rx="10" fill="#181B2C" stroke="#38BDF8" stroke-width="2" />
    <text x="50" y="28" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="14" font-weight="700">vminsert</text>
    <text x="50" y="46" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="10">HRW shard</text>
  </g>

  <!-- vmstorage -->
  <g transform="translate(460, 80)">
    <rect width="100" height="60" rx="10" fill="#181B2C" stroke="#BD10E0" stroke-width="2" />
    <text x="50" y="28" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="14" font-weight="700">vmstorage</text>
    <text x="50" y="46" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="10">disk</text>
  </g>

  <!-- vmselect -->
  <g transform="translate(600, 80)">
    <rect width="100" height="60" rx="10" fill="#181B2C" stroke="#50E3C2" stroke-width="2" />
    <text x="50" y="28" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="14" font-weight="700">vmselect</text>
    <text x="50" y="46" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="10">fan-out</text>
  </g>

  <!-- Grafana -->
  <g transform="translate(720, 80)">
    <circle cx="30" cy="30" r="28" fill="#F46800" stroke="#fff" stroke-width="2" />
    <text x="30" y="36" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="900">G</text>
  </g>

  <!-- Component highlight pulse rings -->
  <circle cx="90" cy="110" r="35" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0">
    <animate attributeName="r" values="32;45;32" dur="6s" begin="0.4s;orb.end+0.4s" repeatCount="1" />
    <animate attributeName="opacity" values="0;0.8;0" dur="6s" begin="0.4s;orb.end+0.4s" repeatCount="1" />
  </circle>
  <circle cx="230" cy="110" r="35" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0">
    <animate attributeName="r" values="32;45;32" dur="6s" begin="1.4s;orb.end+1.4s" repeatCount="1" />
    <animate attributeName="opacity" values="0;0.8;0" dur="6s" begin="1.4s;orb.end+1.4s" repeatCount="1" />
  </circle>
  <circle cx="370" cy="110" r="35" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0">
    <animate attributeName="r" values="32;45;32" dur="6s" begin="2.4s;orb.end+2.4s" repeatCount="1" />
    <animate attributeName="opacity" values="0;0.8;0" dur="6s" begin="2.4s;orb.end+2.4s" repeatCount="1" />
  </circle>
  <circle cx="510" cy="110" r="35" fill="none" stroke="#BD10E0" stroke-width="2" opacity="0">
    <animate attributeName="r" values="32;45;32" dur="6s" begin="3.4s;orb.end+3.4s" repeatCount="1" />
    <animate attributeName="opacity" values="0;0.8;0" dur="6s" begin="3.4s;orb.end+3.4s" repeatCount="1" />
  </circle>
  <circle cx="650" cy="110" r="35" fill="none" stroke="#50E3C2" stroke-width="2" opacity="0">
    <animate attributeName="r" values="32;45;32" dur="6s" begin="4.4s;orb.end+4.4s" repeatCount="1" />
    <animate attributeName="opacity" values="0;0.8;0" dur="6s" begin="4.4s;orb.end+4.4s" repeatCount="1" />
  </circle>

  <!-- The traveling metric orb -->
  <g>
    <!-- Aura -->
    <circle r="20" fill="url(#orbGlow)">
      <animate attributeName="cx" values="90;230;370;510;650;750" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="6s" repeatCount="indefinite" id="orb" />
      <animate attributeName="cy" values="110;110;110;110;110;110" dur="6s" repeatCount="indefinite" />
    </circle>
    <!-- Core -->
    <circle r="6" fill="#00FF85">
      <animate attributeName="cx" values="90;230;370;510;650;750" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="6s" repeatCount="indefinite" />
      <animate attributeName="cy" values="110;110;110;110;110;110" dur="6s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Stage labels -->
  <text x="90" y="170" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="11">/metrics</text>
  <text x="230" y="170" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="11">remote_write</text>
  <text x="370" y="170" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="11">xxhash64</text>
  <text x="510" y="170" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="11">fsync+rename</text>
  <text x="650" y="170" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="11">MetricsQL</text>
  <text x="750" y="170" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="11">JSON</text>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16" font-weight="800">Journey of one metric sample</text>
  <text x="400" y="50" text-anchor="middle" fill="#94A3B8" font-family="Arial, sans-serif" font-size="12">app → vmagent → vminsert → vmstorage → vmselect → Grafana</text>

  <!-- Bottom timing strip -->
  <text x="400" y="200" text-anchor="middle" fill="#50E3C2" font-family="monospace" font-size="11">~ 60 seconds end-to-end</text>
</svg>
