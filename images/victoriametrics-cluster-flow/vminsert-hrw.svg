<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440">
  <defs>
    <linearGradient id="bgHRW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0E1A" />
      <stop offset="100%" stop-color="#14182B" />
    </linearGradient>
    <linearGradient id="winnerBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00FF85" />
    </linearGradient>
  </defs>

  <rect width="800" height="440" fill="url(#bgHRW)" />

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" font-weight="800">Rendezvous Hashing — pick the winner</text>

  <!-- Series hash at top -->
  <g transform="translate(280, 60)">
    <rect width="240" height="50" rx="10" fill="#181B2C" stroke="#38BDF8" stroke-width="2" />
    <text x="120" y="22" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="11">series_hash</text>
    <text x="120" y="40" text-anchor="middle" fill="#00FF85" font-family="monospace" font-size="14" font-weight="700">xxhash64 = 0xA3F9C8...</text>
  </g>

  <!-- 3 candidate nodes -->
  <g transform="translate(70, 200)">
    <!-- Node 1 -->
    <g>
      <rect width="180" height="120" rx="12" fill="#181B2C" stroke="#BD10E0" stroke-width="2" opacity="0.7">
        <animate attributeName="opacity" values="0.7;0.4;0.4" keyTimes="0;0.6;1" dur="6s" repeatCount="indefinite" />
      </rect>
      <text x="90" y="32" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16" font-weight="800">node 1</text>
      <text x="90" y="55" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="11">XOR score</text>
      <!-- Score bar -->
      <rect x="20" y="68" width="140" height="14" rx="3" fill="#1E2438" />
      <rect x="20" y="68" width="0" height="14" rx="3" fill="#BD10E0">
        <animate attributeName="width" values="0;55;55" keyTimes="0;0.3;1" dur="6s" repeatCount="indefinite" />
      </rect>
      <text x="90" y="100" text-anchor="middle" fill="#BD10E0" font-family="monospace" font-size="13" font-weight="700">0x4F2B</text>
    </g>

    <!-- Node 2 (winner) -->
    <g transform="translate(220, 0)">
      <rect width="180" height="120" rx="12" fill="#181B2C" stroke="#00FF85" stroke-width="3">
        <animate attributeName="stroke-width" values="2;4;3" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite" />
      </rect>
      <text x="90" y="32" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16" font-weight="800">node 2</text>
      <text x="90" y="55" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="11">XOR score</text>
      <rect x="20" y="68" width="140" height="14" rx="3" fill="#1E2438" />
      <rect x="20" y="68" width="0" height="14" rx="3" fill="#00FF85">
        <animate attributeName="width" values="0;125;125" keyTimes="0;0.3;1" dur="6s" repeatCount="indefinite" />
      </rect>
      <text x="90" y="100" text-anchor="middle" fill="#00FF85" font-family="monospace" font-size="13" font-weight="700">0xB8E3</text>
      <!-- WINNER badge -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite" />
        <rect x="60" y="-22" width="60" height="20" rx="10" fill="#00FF85" />
        <text x="90" y="-7" text-anchor="middle" fill="#000" font-family="Arial, sans-serif" font-size="12" font-weight="900">★ MAX</text>
      </g>
    </g>

    <!-- Node 3 -->
    <g transform="translate(440, 0)">
      <rect width="180" height="120" rx="12" fill="#181B2C" stroke="#BD10E0" stroke-width="2" opacity="0.7">
        <animate attributeName="opacity" values="0.7;0.4;0.4" keyTimes="0;0.6;1" dur="6s" repeatCount="indefinite" />
      </rect>
      <text x="90" y="32" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16" font-weight="800">node 3</text>
      <text x="90" y="55" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="11">XOR score</text>
      <rect x="20" y="68" width="140" height="14" rx="3" fill="#1E2438" />
      <rect x="20" y="68" width="0" height="14" rx="3" fill="#BD10E0">
        <animate attributeName="width" values="0;90;90" keyTimes="0;0.3;1" dur="6s" repeatCount="indefinite" />
      </rect>
      <text x="90" y="100" text-anchor="middle" fill="#BD10E0" font-family="monospace" font-size="13" font-weight="700">0x71A7</text>
    </g>
  </g>

  <!-- Beam from series hash to winner -->
  <line x1="400" y1="110" x2="380" y2="200" stroke="#38BDF8" stroke-width="3" opacity="0">
    <animate attributeName="opacity" values="0;0;0.4;0.9;0.9" keyTimes="0;0.2;0.4;0.6;1" dur="6s" repeatCount="indefinite" />
  </line>
  <line x1="380" y1="200" x2="380" y2="320" stroke="url(#winnerBeam)" stroke-width="6" opacity="0">
    <animate attributeName="opacity" values="0;0;0;0.9;0.9" keyTimes="0;0.4;0.5;0.7;1" dur="6s" repeatCount="indefinite" />
  </line>

  <!-- Sweep beam (scanning effect) -->
  <rect x="50" y="190" width="60" height="140" fill="#38BDF8" opacity="0">
    <animate attributeName="x" values="50;620;620" keyTimes="0;0.4;1" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.18;0.18;0;0" keyTimes="0;0.05;0.4;0.45;1" dur="6s" repeatCount="indefinite" />
  </rect>

  <!-- Bottom annotation -->
  <text x="400" y="380" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="14" font-weight="700">winner = max( fastHashUint64(node_hash XOR series_hash) )</text>
  <text x="400" y="402" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="12">deterministic · adding/removing 1 node moves only 1/N series</text>
  <text x="400" y="424" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="11">all vminsert pods compute the same winner — no coordination needed</text>
</svg>
