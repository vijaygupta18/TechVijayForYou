<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="460" viewBox="0 0 780 460">
  <defs>
    <linearGradient id="bg-layers" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0E1A" />
      <stop offset="100%" stop-color="#1A0E2A" />
    </linearGradient>
    <linearGradient id="layer1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="layer2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
    <linearGradient id="layer3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="layer4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="layer5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>
    <filter id="glow-layers" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="780" height="460" fill="url(#bg-layers)" />

  <!-- Title -->
  <text x="390" y="32" text-anchor="middle" fill="#fff" font-family="Montserrat, sans-serif" font-size="20" font-weight="800">An Image is a Layer Cake</text>
  <text x="390" y="56" text-anchor="middle" fill="#7A8AA0" font-family="Montserrat, sans-serif" font-size="14" font-weight="600">Each Dockerfile line = one cached layer · stable on bottom, volatile on top</text>

  <!-- Stack of layers (built bottom-up) -->
  <g transform="translate(180, 100)">
    <!-- Layer 1 (FROM) -->
    <g>
      <rect x="0" y="280" width="420" height="48" rx="6" fill="url(#layer1)" stroke="#60A5FA" stroke-width="1.5" filter="url(#glow-layers)" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0s" fill="freeze" />
        <animate attributeName="x" values="-50;0" dur="0.5s" begin="0s" fill="freeze" />
      </rect>
      <text x="20" y="310" fill="#fff" font-family="JetBrains Mono, monospace" font-size="14" font-weight="800" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.2s" fill="freeze" />
        FROM node:20-alpine
      </text>
      <text x="400" y="310" text-anchor="end" fill="#fff" font-family="Montserrat, sans-serif" font-size="11" font-weight="700" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.2s" fill="freeze" />
        ~50 MB · stable
      </text>
    </g>

    <!-- Layer 2 (WORKDIR) -->
    <g>
      <rect x="0" y="226" width="420" height="48" rx="6" fill="url(#layer2)" stroke="#67E8F9" stroke-width="1.5" filter="url(#glow-layers)" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.4s" fill="freeze" />
        <animate attributeName="x" values="-50;0" dur="0.5s" begin="0.4s" fill="freeze" />
      </rect>
      <text x="20" y="256" fill="#fff" font-family="JetBrains Mono, monospace" font-size="14" font-weight="800" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.6s" fill="freeze" />
        WORKDIR /app
      </text>
      <text x="400" y="256" text-anchor="end" fill="#fff" font-family="Montserrat, sans-serif" font-size="11" font-weight="700" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.6s" fill="freeze" />
        metadata only
      </text>
    </g>

    <!-- Layer 3 (COPY package.json) -->
    <g>
      <rect x="0" y="172" width="420" height="48" rx="6" fill="url(#layer3)" stroke="#34D399" stroke-width="1.5" filter="url(#glow-layers)" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.8s" fill="freeze" />
        <animate attributeName="x" values="-50;0" dur="0.5s" begin="0.8s" fill="freeze" />
      </rect>
      <text x="20" y="202" fill="#fff" font-family="JetBrains Mono, monospace" font-size="14" font-weight="800" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.0s" fill="freeze" />
        COPY package.json
      </text>
      <text x="400" y="202" text-anchor="end" fill="#fff" font-family="Montserrat, sans-serif" font-size="11" font-weight="700" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.0s" fill="freeze" />
        rare changes
      </text>
    </g>

    <!-- Layer 4 (RUN npm ci) -->
    <g>
      <rect x="0" y="118" width="420" height="48" rx="6" fill="url(#layer4)" stroke="#FCD34D" stroke-width="1.5" filter="url(#glow-layers)" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.2s" fill="freeze" />
        <animate attributeName="x" values="-50;0" dur="0.5s" begin="1.2s" fill="freeze" />
      </rect>
      <text x="20" y="148" fill="#fff" font-family="JetBrains Mono, monospace" font-size="14" font-weight="800" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.4s" fill="freeze" />
        RUN npm ci
      </text>
      <text x="400" y="148" text-anchor="end" fill="#fff" font-family="Montserrat, sans-serif" font-size="11" font-weight="700" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.4s" fill="freeze" />
        ~120 MB · cached
      </text>
    </g>

    <!-- Layer 5 (COPY . . - volatile) -->
    <g>
      <rect x="0" y="64" width="420" height="48" rx="6" fill="url(#layer5)" stroke="#F9A8D4" stroke-width="1.5" filter="url(#glow-layers)" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.6s" fill="freeze" />
        <animate attributeName="x" values="-50;0" dur="0.5s" begin="1.6s" fill="freeze" />
      </rect>
      <text x="20" y="94" fill="#fff" font-family="JetBrains Mono, monospace" font-size="14" font-weight="800" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.8s" fill="freeze" />
        COPY . .
      </text>
      <text x="400" y="94" text-anchor="end" fill="#fff" font-family="Montserrat, sans-serif" font-size="11" font-weight="700" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.8s" fill="freeze" />
        every build
        <animate attributeName="fill" values="#fff;#FCA5A5;#fff" dur="1.5s" begin="2.2s" repeatCount="indefinite" />
      </text>
    </g>

    <!-- Layer 6 (CMD - top) -->
    <g>
      <rect x="0" y="10" width="420" height="48" rx="6" fill="#1F2937" stroke="#94A3B8" stroke-width="1.5" filter="url(#glow-layers)" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.0s" fill="freeze" />
        <animate attributeName="x" values="-50;0" dur="0.5s" begin="2.0s" fill="freeze" />
      </rect>
      <text x="20" y="40" fill="#fff" font-family="JetBrains Mono, monospace" font-size="14" font-weight="800" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.2s" fill="freeze" />
        CMD ["node","server.js"]
      </text>
      <text x="400" y="40" text-anchor="end" fill="#94A3B8" font-family="Montserrat, sans-serif" font-size="11" font-weight="700" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.2s" fill="freeze" />
        startup cmd
      </text>
    </g>
  </g>

  <!-- side annotations -->
  <g transform="translate(20, 100)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="2.5s" fill="freeze" />
    <text x="0" y="0" fill="#F472B6" font-family="Montserrat, sans-serif" font-size="11" font-weight="800">VOLATILE</text>
    <text x="0" y="14" fill="#94A3B8" font-family="Montserrat, sans-serif" font-size="10" font-weight="600">changes every</text>
    <text x="0" y="28" fill="#94A3B8" font-family="Montserrat, sans-serif" font-size="10" font-weight="600">commit</text>
    <line x1="120" y1="-2" x2="160" y2="-2" stroke="#F472B6" stroke-width="2" />
    <polygon points="160,-2 152,-6 152,2" fill="#F472B6" />
  </g>

  <g transform="translate(20, 380)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="2.5s" fill="freeze" />
    <text x="0" y="0" fill="#3B82F6" font-family="Montserrat, sans-serif" font-size="11" font-weight="800">STABLE</text>
    <text x="0" y="14" fill="#94A3B8" font-family="Montserrat, sans-serif" font-size="10" font-weight="600">cached forever</text>
    <text x="0" y="28" fill="#94A3B8" font-family="Montserrat, sans-serif" font-size="10" font-weight="600">across services</text>
    <line x1="100" y1="-2" x2="140" y2="-2" stroke="#3B82F6" stroke-width="2" />
    <polygon points="140,-2 132,-6 132,2" fill="#3B82F6" />
  </g>

  <!-- footer -->
  <text x="390" y="438" text-anchor="middle" fill="#fff" font-family="Montserrat, sans-serif" font-size="14" font-weight="800">Order matters: stable lines on bottom, volatile lines on top → 60s build → 2s build</text>
</svg>
