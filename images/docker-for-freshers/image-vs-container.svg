<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440">
  <defs>
    <linearGradient id="bg-ivc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0E1A" />
      <stop offset="100%" stop-color="#1A1428" />
    </linearGradient>
    <linearGradient id="image-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="container-live" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <radialGradient id="container-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
    <filter id="glow-ivc" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="780" height="440" fill="url(#bg-ivc)" />

  <!-- Title -->
  <text x="390" y="32" text-anchor="middle" fill="#fff" font-family="Montserrat, sans-serif" font-size="20" font-weight="800">Image vs Container — the chocolate mould</text>
  <text x="390" y="56" text-anchor="middle" fill="#7A8AA0" font-family="Montserrat, sans-serif" font-size="14" font-weight="600">One frozen blueprint produces many live instances</text>

  <!-- TOP: IMAGE (mould) -->
  <g transform="translate(290, 90)">
    <!-- snowflake icon for "frozen" -->
    <g transform="translate(-30, 25)" opacity="0.8">
      <text x="0" y="0" fill="#7DD3FC" font-family="Arial" font-size="22">❄</text>
    </g>
    <rect x="0" y="0" width="200" height="80" rx="10" fill="url(#image-grad)" stroke="#7DD3FC" stroke-width="2.5" stroke-dasharray="0">
      <animate attributeName="stroke-dashoffset" values="0;-20" dur="2s" repeatCount="indefinite" />
    </rect>
    <!-- mould cavities (small chocolate-shaped indents) -->
    <rect x="20" y="20" width="40" height="40" rx="6" fill="#0F172A" opacity="0.7" />
    <rect x="80" y="20" width="40" height="40" rx="6" fill="#0F172A" opacity="0.7" />
    <rect x="140" y="20" width="40" height="40" rx="6" fill="#0F172A" opacity="0.7" />
    <text x="100" y="-10" text-anchor="middle" fill="#7DD3FC" font-family="Montserrat, sans-serif" font-size="18" font-weight="900">IMAGE</text>
    <text x="100" y="100" text-anchor="middle" fill="#94A3B8" font-family="Montserrat, sans-serif" font-size="13" font-weight="700">frozen · read-only · the mould</text>
    <text x="100" y="118" text-anchor="middle" fill="#64748B" font-family="JetBrains Mono, monospace" font-size="11">myapp:v1</text>
  </g>

  <!-- 3 arrows from image to containers -->
  <g stroke="#10B981" stroke-width="2" fill="none" filter="url(#glow-ivc)">
    <!-- left arrow -->
    <path d="M 360 215 Q 340 240 200 280">
      <animate attributeName="stroke-dashoffset" values="40;0" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="stroke-dasharray" values="0 40;40 0" dur="1.5s" repeatCount="indefinite" />
    </path>
    <!-- middle arrow -->
    <path d="M 390 215 L 390 280">
      <animate attributeName="stroke-dashoffset" values="40;0" dur="1.5s" begin="0.2s" repeatCount="indefinite" />
      <animate attributeName="stroke-dasharray" values="0 40;40 0" dur="1.5s" begin="0.2s" repeatCount="indefinite" />
    </path>
    <!-- right arrow -->
    <path d="M 420 215 Q 440 240 580 280">
      <animate attributeName="stroke-dashoffset" values="40;0" dur="1.5s" begin="0.4s" repeatCount="indefinite" />
      <animate attributeName="stroke-dasharray" values="0 40;40 0" dur="1.5s" begin="0.4s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- traveling dots along arrows -->
  <circle r="5" fill="#10B981" filter="url(#glow-ivc)">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M 360 215 Q 340 240 200 280" />
  </circle>
  <circle r="5" fill="#10B981" filter="url(#glow-ivc)">
    <animateMotion dur="1.8s" begin="0.2s" repeatCount="indefinite" path="M 390 215 L 390 280" />
  </circle>
  <circle r="5" fill="#10B981" filter="url(#glow-ivc)">
    <animateMotion dur="1.8s" begin="0.4s" repeatCount="indefinite" path="M 420 215 Q 440 240 580 280" />
  </circle>

  <!-- BOTTOM: 3 CONTAINERS (live, glowing) -->
  <g transform="translate(140, 290)">
    <ellipse cx="60" cy="80" rx="55" ry="8" fill="url(#container-glow)" />
    <rect x="10" y="10" width="100" height="65" rx="8" fill="url(#container-live)" stroke="#34D399" stroke-width="2" filter="url(#glow-ivc)">
      <animate attributeName="opacity" values="1;0.85;1" dur="1.4s" repeatCount="indefinite" />
    </rect>
    <text x="60" y="38" text-anchor="middle" fill="#fff" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">PID 1</text>
    <text x="60" y="55" text-anchor="middle" fill="#fff" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">:3000</text>
    <text x="60" y="98" text-anchor="middle" fill="#10B981" font-family="Montserrat, sans-serif" font-size="13" font-weight="800">CONTAINER #1</text>
    <text x="60" y="115" text-anchor="middle" fill="#94A3B8" font-family="Montserrat, sans-serif" font-size="11" font-weight="600">running</text>
  </g>

  <g transform="translate(330, 290)">
    <ellipse cx="60" cy="80" rx="55" ry="8" fill="url(#container-glow)" />
    <rect x="10" y="10" width="100" height="65" rx="8" fill="url(#container-live)" stroke="#34D399" stroke-width="2" filter="url(#glow-ivc)">
      <animate attributeName="opacity" values="1;0.85;1" dur="1.4s" begin="0.4s" repeatCount="indefinite" />
    </rect>
    <text x="60" y="38" text-anchor="middle" fill="#fff" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">PID 1</text>
    <text x="60" y="55" text-anchor="middle" fill="#fff" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">:3001</text>
    <text x="60" y="98" text-anchor="middle" fill="#10B981" font-family="Montserrat, sans-serif" font-size="13" font-weight="800">CONTAINER #2</text>
    <text x="60" y="115" text-anchor="middle" fill="#94A3B8" font-family="Montserrat, sans-serif" font-size="11" font-weight="600">running</text>
  </g>

  <g transform="translate(520, 290)">
    <ellipse cx="60" cy="80" rx="55" ry="8" fill="url(#container-glow)" />
    <rect x="10" y="10" width="100" height="65" rx="8" fill="url(#container-live)" stroke="#34D399" stroke-width="2" filter="url(#glow-ivc)">
      <animate attributeName="opacity" values="1;0.85;1" dur="1.4s" begin="0.8s" repeatCount="indefinite" />
    </rect>
    <text x="60" y="38" text-anchor="middle" fill="#fff" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">PID 1</text>
    <text x="60" y="55" text-anchor="middle" fill="#fff" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">:3002</text>
    <text x="60" y="98" text-anchor="middle" fill="#10B981" font-family="Montserrat, sans-serif" font-size="13" font-weight="800">CONTAINER #3</text>
    <text x="60" y="115" text-anchor="middle" fill="#94A3B8" font-family="Montserrat, sans-serif" font-size="11" font-weight="600">running</text>
  </g>

  <!-- footer -->
  <text x="390" y="425" text-anchor="middle" fill="#10B981" font-family="Montserrat, sans-serif" font-size="14" font-weight="800">1 image → many containers · same recipe, many live processes</text>
</svg>
