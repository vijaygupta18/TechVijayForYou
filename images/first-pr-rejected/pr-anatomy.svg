<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="450" viewBox="0 0 700 450">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C0A1D" />
      <stop offset="100%" stop-color="#1A1635" />
    </linearGradient>
    <filter id="g5">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="prHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22C55E20" />
      <stop offset="100%" stop-color="#6366F120" />
    </linearGradient>
  </defs>

  <rect width="700" height="450" fill="url(#bg5)" />

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" fill="#fff" font-size="17" font-weight="800" font-family="sans-serif" opacity="0">
    Anatomy of a PR That Gets Approved
    <animate attributeName="opacity" values="0;1" dur="0.6s" fill="freeze" />
  </text>

  <!-- PR Card outer frame -->
  <rect x="80" y="50" width="540" height="380" rx="14" fill="#0F0F1A" stroke="#6366F130" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.5s" fill="freeze" />
  </rect>

  <!-- PR Title Bar -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.8s" fill="freeze" />
    <rect x="80" y="50" width="540" height="44" rx="14" fill="url(#prHeader)" />
    <rect x="80" y="80" width="540" height="14" fill="url(#prHeader)" />
    <!-- Green open icon -->
    <circle cx="105" cy="72" r="8" fill="#22C55E20" stroke="#22C55E" stroke-width="1.5" />
    <text x="105" y="76" text-anchor="middle" fill="#22C55E" font-size="10" font-weight="800" font-family="sans-serif">O</text>
    <!-- Title text -->
    <text x="125" y="68" fill="#fff" font-size="13" font-weight="800" font-family="sans-serif">Fix empty cart 500 error in checkout flow</text>
    <text x="125" y="84" fill="#9CA3B8" font-size="10" font-family="sans-serif">#1234 opened by you · 3 files changed · +47 -12</text>
  </g>

  <!-- Section 1: WHAT -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.3s" fill="freeze" />
    <rect x="100" y="105" width="500" height="55" rx="8" fill="#6366F108" />
    <rect x="100" y="105" width="4" height="55" rx="2" fill="#6366F1" />
    <text x="120" y="122" fill="#6366F1" font-size="12" font-weight="800" font-family="sans-serif">WHAT</text>
    <text x="120" y="138" fill="#ccc" font-size="11" font-family="sans-serif">Handle edge case where user submits empty cart,</text>
    <text x="120" y="152" fill="#ccc" font-size="11" font-family="sans-serif">which previously caused a 500 error.</text>
  </g>

  <!-- Section 2: WHY -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.8s" fill="freeze" />
    <rect x="100" y="168" width="500" height="55" rx="8" fill="#EF444408" />
    <rect x="100" y="168" width="4" height="55" rx="2" fill="#EF4444" />
    <text x="120" y="185" fill="#EF4444" font-size="12" font-weight="800" font-family="sans-serif">WHY</text>
    <text x="120" y="201" fill="#ccc" font-size="11" font-family="sans-serif">3 users reported a generic error page when clicking</text>
    <text x="120" y="215" fill="#ccc" font-size="11" font-family="sans-serif">"Checkout" with empty cart. Root cause: division by zero.</text>
  </g>

  <!-- Section 3: HOW -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.3s" fill="freeze" />
    <rect x="100" y="231" width="500" height="65" rx="8" fill="#22C55E08" />
    <rect x="100" y="231" width="4" height="65" rx="2" fill="#22C55E" />
    <text x="120" y="248" fill="#22C55E" font-size="12" font-weight="800" font-family="sans-serif">HOW</text>
    <text x="120" y="264" fill="#ccc" font-size="11" font-family="sans-serif">- Added empty cart check at checkout handler start</text>
    <text x="120" y="278" fill="#ccc" font-size="11" font-family="sans-serif">- Returns 400 "Cart is empty" instead of crashing</text>
    <text x="120" y="292" fill="#ccc" font-size="11" font-family="sans-serif">- Added unit test for empty cart edge case</text>
  </g>

  <!-- Section 4: TESTING -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.8s" fill="freeze" />
    <rect x="100" y="304" width="500" height="55" rx="8" fill="#F59E0B08" />
    <rect x="100" y="304" width="4" height="55" rx="2" fill="#F59E0B" />
    <text x="120" y="321" fill="#F59E0B" font-size="12" font-weight="800" font-family="sans-serif">TESTING</text>
    <text x="120" y="337" fill="#22C55E" font-size="11" font-family="sans-serif">&#x2713; Unit test: test_empty_cart_returns_400</text>
    <text x="120" y="351" fill="#22C55E" font-size="11" font-family="sans-serif">&#x2713; Manual test: empty cart → 400 response</text>
  </g>

  <!-- Section 5: RELATED -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.3s" fill="freeze" />
    <rect x="100" y="367" width="500" height="40" rx="8" fill="#8B5CF608" />
    <rect x="100" y="367" width="4" height="40" rx="2" fill="#8B5CF6" />
    <text x="120" y="384" fill="#8B5CF6" font-size="12" font-weight="800" font-family="sans-serif">RELATED</text>
    <text x="120" y="400" fill="#6366F1" font-size="11" font-family="sans-serif" text-decoration="underline">Closes #1234 · Slack: #checkout-bugs</text>
  </g>

  <!-- Approval badge (appears at end) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="4.0s" fill="freeze" />
    <rect x="460" y="410" width="140" height="30" rx="8" fill="#22C55E20" stroke="#22C55E" stroke-width="1.5" filter="url(#g5)" />
    <text x="530" y="430" text-anchor="middle" fill="#22C55E" font-size="12" font-weight="800" font-family="sans-serif">&#x2713; Approved</text>
  </g>

  <!-- Bad PR comparison (small, faded) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0.6" dur="0.5s" begin="0.6s" fill="freeze" />
    <rect x="80" y="415" width="200" height="28" rx="6" fill="#EF444408" stroke="#EF444430" stroke-width="1" />
    <text x="100" y="433" fill="#EF444480" font-size="10" font-family="sans-serif">vs. "Fix bug" + empty description</text>
  </g>
</svg>
