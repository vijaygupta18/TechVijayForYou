<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="380" viewBox="0 0 700 380">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C0A1D" />
      <stop offset="100%" stop-color="#1A1635" />
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="700" height="380" fill="url(#bg2)" />

  <!-- Title -->
  <text x="350" y="35" text-anchor="middle" fill="#fff" font-size="18" font-weight="800" font-family="sans-serif" opacity="0">
    What Code Reviewers Actually Focus On
    <animate attributeName="opacity" values="0;1" dur="0.6s" fill="freeze" />
  </text>
  <text x="350" y="55" text-anchor="middle" fill="#9CA3B8" font-size="11" font-family="sans-serif" opacity="0">
    Microsoft Research — 2013 (Bacchelli &amp; Bird)
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.3s" fill="freeze" />
  </text>

  <!-- Animated horizontal bar chart -->
  <!-- Bar 1: Code improvements (readability, style, naming) — 28% -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.8s" fill="freeze" />
    <text x="25" y="100" fill="#9CA3B8" font-size="11" font-weight="600" font-family="sans-serif">Readability &amp; Naming</text>
    <rect x="200" y="88" width="0" height="22" rx="4" fill="#6366F1">
      <animate attributeName="width" values="0;280" dur="1s" begin="1.0s" fill="freeze" />
    </rect>
    <text x="490" y="104" fill="#6366F1" font-size="14" font-weight="800" font-family="sans-serif" opacity="0">
      28%
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.8s" fill="freeze" />
    </text>
  </g>

  <!-- Bar 2: Knowledge transfer — 20% -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.2s" fill="freeze" />
    <text x="25" y="140" fill="#9CA3B8" font-size="11" font-weight="600" font-family="sans-serif">Knowledge Transfer</text>
    <rect x="200" y="128" width="0" height="22" rx="4" fill="#8B5CF6">
      <animate attributeName="width" values="0;200" dur="1s" begin="1.4s" fill="freeze" />
    </rect>
    <text x="410" y="144" fill="#8B5CF6" font-size="14" font-weight="800" font-family="sans-serif" opacity="0">
      20%
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.2s" fill="freeze" />
    </text>
  </g>

  <!-- Bar 3: Defect finding — 14% -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.6s" fill="freeze" />
    <text x="25" y="180" fill="#9CA3B8" font-size="11" font-weight="600" font-family="sans-serif">Bug Finding</text>
    <rect x="200" y="168" width="0" height="22" rx="4" fill="#EF4444">
      <animate attributeName="width" values="0;140" dur="1s" begin="1.8s" fill="freeze" />
    </rect>
    <text x="350" y="184" fill="#EF4444" font-size="14" font-weight="800" font-family="sans-serif" opacity="0">
      14%
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.6s" fill="freeze" />
    </text>
    <!-- Highlight: "Only 14% is about bugs!" -->
    <text x="395" y="184" fill="#EF444480" font-size="10" font-style="italic" font-family="sans-serif" opacity="0">
      ← only this much is about bugs
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.0s" fill="freeze" />
    </text>
  </g>

  <!-- Bar 4: Alternative solutions — 12% -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.0s" fill="freeze" />
    <text x="25" y="220" fill="#9CA3B8" font-size="11" font-weight="600" font-family="sans-serif">Better Approaches</text>
    <rect x="200" y="208" width="0" height="22" rx="4" fill="#06B6D4">
      <animate attributeName="width" values="0;120" dur="1s" begin="2.2s" fill="freeze" />
    </rect>
    <text x="330" y="224" fill="#06B6D4" font-size="14" font-weight="800" font-family="sans-serif" opacity="0">
      12%
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="3.0s" fill="freeze" />
    </text>
  </g>

  <!-- Bar 5: Documentation — 10% -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.4s" fill="freeze" />
    <text x="25" y="260" fill="#9CA3B8" font-size="11" font-weight="600" font-family="sans-serif">Documentation</text>
    <rect x="200" y="248" width="0" height="22" rx="4" fill="#F59E0B">
      <animate attributeName="width" values="0;100" dur="1s" begin="2.6s" fill="freeze" />
    </rect>
    <text x="310" y="264" fill="#F59E0B" font-size="14" font-weight="800" font-family="sans-serif" opacity="0">
      10%
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="3.4s" fill="freeze" />
    </text>
  </g>

  <!-- Bar 6: Other — 16% -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.8s" fill="freeze" />
    <text x="25" y="300" fill="#9CA3B8" font-size="11" font-weight="600" font-family="sans-serif">Other</text>
    <rect x="200" y="288" width="0" height="22" rx="4" fill="#64748B">
      <animate attributeName="width" values="0;160" dur="1s" begin="3.0s" fill="freeze" />
    </rect>
    <text x="370" y="304" fill="#64748B" font-size="14" font-weight="800" font-family="sans-serif" opacity="0">
      16%
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="3.8s" fill="freeze" />
    </text>
  </g>

  <!-- Key insight callout -->
  <rect x="100" y="330" width="500" height="35" rx="8" fill="#6366F110" stroke="#6366F140" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="4.2s" fill="freeze" />
  </rect>
  <text x="350" y="352" text-anchor="middle" fill="#6366F1" font-size="12" font-weight="700" font-family="sans-serif" opacity="0">
    86% of review comments are NOT about bugs — they're about humans reading code
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="4.5s" fill="freeze" />
  </text>
</svg>
