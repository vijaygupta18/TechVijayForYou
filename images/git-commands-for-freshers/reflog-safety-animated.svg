<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f1f"/>
      <stop offset="100%" stop-color="#040818"/>
    </linearGradient>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="360" fill="url(#bg4)"/>

  <text x="500" y="45" text-anchor="middle" fill="#ffffff" font-family="Montserrat, Arial, sans-serif" font-size="24" font-weight="800">git reflog — Your Safety Net</text>
  <text x="500" y="72" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="14">even if you hard reset, your commits live for 90 days</text>

  <!-- Timeline -->
  <line x1="100" y1="180" x2="900" y2="180" stroke="#334155" stroke-width="2"/>

  <!-- Commits -->
  <g>
    <circle cx="150" cy="180" r="14" fill="#00e5ff" filter="url(#glow4)"/>
    <text x="150" y="220" text-anchor="middle" fill="#9CA3AF" font-family="JetBrains Mono, Courier New, monospace" font-size="11">C1</text>
  </g>
  <g>
    <circle cx="280" cy="180" r="14" fill="#00e5ff" filter="url(#glow4)"/>
    <text x="280" y="220" text-anchor="middle" fill="#9CA3AF" font-family="JetBrains Mono, Courier New, monospace" font-size="11">C2</text>
  </g>
  <g>
    <circle cx="410" cy="180" r="14" fill="#00e5ff" filter="url(#glow4)"/>
    <text x="410" y="220" text-anchor="middle" fill="#9CA3AF" font-family="JetBrains Mono, Courier New, monospace" font-size="11">C3</text>
  </g>

  <!-- "Lost" commits (animate fading to red) -->
  <g>
    <circle cx="540" cy="180" r="14" fill="#00e5ff" filter="url(#glow4)">
      <animate attributeName="fill" values="#00e5ff;#ff3d5c;#00e5ff" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="540" y="220" text-anchor="middle" fill="#9CA3AF" font-family="JetBrains Mono, Courier New, monospace" font-size="11">C4</text>
  </g>
  <g>
    <circle cx="670" cy="180" r="14" fill="#00e5ff" filter="url(#glow4)">
      <animate attributeName="fill" values="#00e5ff;#ff3d5c;#00e5ff" dur="4s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="4s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <text x="670" y="220" text-anchor="middle" fill="#9CA3AF" font-family="JetBrains Mono, Courier New, monospace" font-size="11">C5</text>
  </g>

  <!-- HEAD pointer -->
  <g>
    <rect x="380" y="130" width="60" height="28" rx="4" fill="#ffb300">
      <animate attributeName="x" values="380;380;380;150;150;150;380"
               keyTimes="0;0.15;0.3;0.45;0.6;0.75;1"
               dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="410" y="149" text-anchor="middle" fill="#040818" font-family="JetBrains Mono, Courier New, monospace" font-size="14" font-weight="700">HEAD
      <animate attributeName="x" values="410;410;410;180;180;180;410"
               keyTimes="0;0.15;0.3;0.45;0.6;0.75;1"
               dur="6s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- "git reset --hard HEAD~2" warning -->
  <text x="500" y="290" text-anchor="middle" fill="#ff3d5c" font-family="JetBrains Mono, Courier New, monospace" font-size="14" font-weight="700">git reset --hard HEAD~2   →   C4, C5 look lost</text>
  <text x="500" y="315" text-anchor="middle" fill="#10e891" font-family="JetBrains Mono, Courier New, monospace" font-size="14" font-weight="700">git reflog   →   still there, recover with git reset --hard &lt;sha&gt;</text>

  <!-- Animated "recovery beam" -->
  <line x1="540" y1="180" x2="410" y2="180" stroke="#10e891" stroke-width="3" stroke-dasharray="6,4" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.6;0.9;0.95;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dashoffset" from="0" to="20" dur="0.8s" repeatCount="indefinite"/>
  </line>
</svg>
