<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0E1A"/>
      <stop offset="100%" stop-color="#14182B"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowCyan" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#FF3B3B"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#00FF85"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="760" height="420" fill="url(#bg)"/>

  <!-- title -->
  <text x="380" y="34" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800">Detection &#8800; Response</text>
  <text x="380" y="58" text-anchor="middle" fill="#8B93A7" font-size="13">The Empire State camera detected them in seconds. Nobody responded.</text>

  <!-- shared top node: AI CCTV detects anomaly -->
  <g>
    <circle cx="256" cy="87" r="18" fill="none" stroke="#00FF85" stroke-width="1.5" opacity="0.5">
      <animate attributeName="r" values="10;19;10" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.05;0.7" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <rect x="230" y="68" width="300" height="38" rx="10" fill="#1C2238" stroke="#2A3350" stroke-width="1.5" filter="url(#glow)"/>
    <circle cx="256" cy="87" r="9" fill="none" stroke="#00FF85" stroke-width="2"/>
    <path d="M251,87 L255,91 L262,82" fill="none" stroke="#00FF85" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="392" y="92" text-anchor="middle" fill="#00FF85" font-size="14" font-weight="700">AI CCTV detects anomaly</text>
  </g>

  <!-- trunk arrow -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="7s" repeatCount="indefinite"/>
    <line x1="380" y1="106" x2="380" y2="119" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
  </g>

  <!-- LEFT branch: What happened -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.09;0.95;1" dur="7s" repeatCount="indefinite"/>
    <line x1="374" y1="120" x2="196" y2="123" stroke="#FF3B3B" stroke-width="2.5" marker-end="url(#arrowRed)"/>
    <text x="190" y="130" text-anchor="middle" fill="#FF3B3B" font-size="13" font-weight="700">What happened</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.14;0.95;1" dur="7s" repeatCount="indefinite"/>
    <rect x="60" y="138" width="260" height="34" rx="10" fill="#1C2238" stroke="#FF3B3B55" stroke-width="1.5"/>
    <circle cx="84" cy="155" r="8" fill="none" stroke="#FF3B3B" stroke-width="1.5"/>
    <text x="84" y="159" text-anchor="middle" fill="#FF3B3B" font-size="11" font-weight="800">!</text>
    <text x="200" y="159" text-anchor="middle" fill="#E5E7EB" font-size="13">No alert acted on</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.18;0.95;1" dur="7s" repeatCount="indefinite"/>
    <line x1="190" y1="172" x2="190" y2="181" stroke="#FF3B3B" stroke-width="2" marker-end="url(#arrowRed)"/>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0.55;0.55;0" keyTimes="0;0.20;0.95;1" dur="7s" repeatCount="indefinite"/>
    <rect x="60" y="182" width="260" height="34" rx="10" fill="#1C2238" stroke="#FF3B3B55" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M78,192 L90,204 M90,192 L78,204" stroke="#FF3B3B" stroke-width="2" stroke-linecap="round"/>
    <text x="204" y="203" text-anchor="middle" fill="#FF3B3B" font-size="12.5">Intruder reaches the top</text>
  </g>

  <!-- RIGHT branch: With SOAR -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.28;0.95;1" dur="7s" repeatCount="indefinite"/>
    <line x1="386" y1="120" x2="564" y2="123" stroke="#00FF85" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
    <text x="570" y="130" text-anchor="middle" fill="#00FF85" font-size="13" font-weight="700">With SOAR</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.33;0.95;1" dur="7s" repeatCount="indefinite"/>
    <rect x="440" y="138" width="260" height="34" rx="10" fill="#1C2238" stroke="#00FF8555" stroke-width="1.5"/>
    <circle cx="464" cy="155" r="6" fill="#00FF85"/>
    <text x="580" y="159" text-anchor="middle" fill="#E5E7EB" font-size="13">Auto-alert fires</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.37;0.95;1" dur="7s" repeatCount="indefinite"/>
    <line x1="570" y1="172" x2="570" y2="181" stroke="#00FF85" stroke-width="2" marker-end="url(#arrowGreen)"/>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.39;0.95;1" dur="7s" repeatCount="indefinite"/>
    <rect x="440" y="182" width="260" height="34" rx="10" fill="#1C2238" stroke="#00FF8555" stroke-width="1.5"/>
    <circle cx="464" cy="199" r="6" fill="#00FF85"/>
    <text x="582" y="203" text-anchor="middle" fill="#E5E7EB" font-size="13">Guard dispatched</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.42;0.95;1" dur="7s" repeatCount="indefinite"/>
    <line x1="570" y1="216" x2="570" y2="225" stroke="#00FF85" stroke-width="2" marker-end="url(#arrowGreen)"/>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.45;0.95;1" dur="7s" repeatCount="indefinite"/>
    <rect x="440" y="226" width="260" height="34" rx="10" fill="#1C2238" stroke="#00FF85" stroke-width="1.5" filter="url(#glow)"/>
    <circle cx="464" cy="243" r="9" fill="none" stroke="#00FF85" stroke-width="2"/>
    <path d="M459,243 L463,247 L470,238" fill="none" stroke="#00FF85" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="588" y="248" text-anchor="middle" fill="#00FF85" font-size="14" font-weight="700">Contained</text>
  </g>

  <!-- Center banner -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.52;0.95;1" dur="7s" repeatCount="indefinite"/>
    <rect x="140" y="278" width="480" height="42" rx="10" fill="#14182B" stroke="#FF3B3B" stroke-width="1.5" filter="url(#glow)">
      <animate attributeName="stroke" values="#FF3B3B;#8B93A7;#FF3B3B" dur="2.4s" begin="3.64s" repeatCount="indefinite"/>
    </rect>
    <text x="380" y="305" text-anchor="middle" font-size="18" font-weight="800">
      <animate attributeName="fill" values="#FF3B3B;#E5E7EB;#FF3B3B" dur="2.4s" begin="3.64s" repeatCount="indefinite"/>
      Detection without Response = 0
    </text>
  </g>

  <!-- Stat strip -->
  <!-- Tile 1: MTTD -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.58;0.95;1" dur="7s" repeatCount="indefinite"/>
    <rect x="30" y="332" width="220" height="54" rx="10" fill="#1C2238" stroke="#2A3350" stroke-width="1.5"/>
    <text x="140" y="349" text-anchor="middle" fill="#8B93A7" font-size="10.5" font-weight="600" letter-spacing="0.5">MEDIAN TIME TO DETECT</text>
    <text x="118" y="376" text-anchor="middle" fill="#FFB020" font-size="20" font-weight="800">
      <tspan>&#8776;</tspan>
    </text>
    <text x="168" y="376" text-anchor="middle" fill="#FFB020" font-size="13" font-weight="700">hrs</text>
  </g>
  <!-- MTTD counter digits stacked at x=140 -->
  <text x="142" y="376" text-anchor="middle" fill="#FFB020" font-size="20" font-weight="800" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.580;0.582;0.594;0.596;1" dur="7s" repeatCount="indefinite"/>0</text>
  <text x="142" y="376" text-anchor="middle" fill="#FFB020" font-size="20" font-weight="800" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.596;0.598;0.610;0.612;1" dur="7s" repeatCount="indefinite"/>4</text>
  <text x="142" y="376" text-anchor="middle" fill="#FFB020" font-size="20" font-weight="800" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.612;0.614;0.626;0.628;1" dur="7s" repeatCount="indefinite"/>8</text>
  <text x="142" y="376" text-anchor="middle" fill="#FFB020" font-size="20" font-weight="800" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.628;0.630;0.642;0.644;1" dur="7s" repeatCount="indefinite"/>12</text>
  <text x="142" y="376" text-anchor="middle" fill="#FFB020" font-size="20" font-weight="800" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.644;0.646;0.95;1" dur="7s" repeatCount="indefinite"/>16</text>

  <!-- Tile 2: dwell time -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.60;0.95;1" dur="7s" repeatCount="indefinite"/>
    <rect x="270" y="332" width="220" height="54" rx="10" fill="#1C2238" stroke="#2A3350" stroke-width="1.5"/>
    <text x="380" y="349" text-anchor="middle" fill="#8B93A7" font-size="10.5" font-weight="600" letter-spacing="0.5">MEDIAN ATTACKER DWELL</text>
    <text x="358" y="376" text-anchor="middle" fill="#FFB020" font-size="20" font-weight="800">&#8776;</text>
    <text x="418" y="376" text-anchor="middle" fill="#FFB020" font-size="13" font-weight="700">days</text>
  </g>
  <!-- dwell counter digits stacked at x=382 -->
  <text x="382" y="376" text-anchor="middle" fill="#FFB020" font-size="20" font-weight="800" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.600;0.602;0.618;0.620;1" dur="7s" repeatCount="indefinite"/>0</text>
  <text x="382" y="376" text-anchor="middle" fill="#FFB020" font-size="20" font-weight="800" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.620;0.622;0.638;0.640;1" dur="7s" repeatCount="indefinite"/>3</text>
  <text x="382" y="376" text-anchor="middle" fill="#FFB020" font-size="20" font-weight="800" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.640;0.642;0.658;0.660;1" dur="7s" repeatCount="indefinite"/>6</text>
  <text x="382" y="376" text-anchor="middle" fill="#FFB020" font-size="20" font-weight="800" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.660;0.662;0.95;1" dur="7s" repeatCount="indefinite"/>10</text>

  <!-- Tile 3: SOAR impact -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.64;0.95;1" dur="7s" repeatCount="indefinite"/>
    <rect x="510" y="332" width="220" height="54" rx="10" fill="#1C2238" stroke="#00FF8555" stroke-width="1.5"/>
    <text x="620" y="349" text-anchor="middle" fill="#8B93A7" font-size="10.5" font-weight="600" letter-spacing="0.5">SOAR CUTS MTTR BY</text>
    <text x="620" y="378" text-anchor="middle" fill="#00FF85" font-size="21" font-weight="800">
      <animate attributeName="font-size" values="21;24;21" dur="1.1s" begin="4.48s" repeatCount="indefinite"/>60&#8211;90%</text>
  </g>

  <!-- caption -->
  <text x="380" y="402" text-anchor="middle" fill="#6B7280" font-size="12" font-style="italic">Monitoring that no one acts on is theater. Response time is the metric that matters.</text>
</svg>
