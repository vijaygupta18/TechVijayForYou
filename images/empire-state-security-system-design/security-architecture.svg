<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0E1A"/>
      <stop offset="100%" stop-color="#14182B"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF85" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00FF85" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="760" height="480" fill="url(#bg)"/>
  <circle cx="90" cy="90" r="150" fill="url(#glowCyan)"/>
  <circle cx="700" cy="400" r="170" fill="url(#glowGreen)"/>

  <!-- Title -->
  <text x="380" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Security System Architecture</text>
  <text x="380" y="58" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8B93A7">Scalable, fault-tolerant, highly available — never trust the perimeter alone</text>

  <!-- ============ CONNECTOR SPINE (drawn in gaps between layers) ============ -->
  <g id="spine">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.4s" fill="freeze"/>
      <line x1="380" y1="120" x2="380" y2="140" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3,3" opacity="0.85"/>
      <circle cx="380" cy="130" r="3.2" fill="#38BDF8" filter="url(#glow)">
        <animate attributeName="r" values="3.2;4.4;3.2" dur="2.2s" begin="0.9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2.2s" begin="0.9s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.4s" fill="freeze"/>
      <line x1="380" y1="184" x2="380" y2="204" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3,3" opacity="0.85"/>
      <circle cx="380" cy="194" r="3.2" fill="#38BDF8" filter="url(#glow)">
        <animate attributeName="r" values="3.2;4.4;3.2" dur="2.2s" begin="1.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2.2s" begin="1.4s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.4s" fill="freeze"/>
      <line x1="380" y1="248" x2="380" y2="268" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3,3" opacity="0.85"/>
      <circle cx="380" cy="258" r="3.2" fill="#38BDF8" filter="url(#glow)">
        <animate attributeName="r" values="3.2;4.4;3.2" dur="2.2s" begin="1.9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2.2s" begin="1.9s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="2.1s" dur="0.4s" fill="freeze"/>
      <line x1="380" y1="312" x2="380" y2="332" stroke="#FFB020" stroke-width="2" stroke-dasharray="3,3" opacity="0.85"/>
      <circle cx="380" cy="322" r="3.2" fill="#FFB020" filter="url(#glow)">
        <animate attributeName="r" values="3.2;4.4;3.2" dur="2.2s" begin="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2.2s" begin="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- ============ LAYER 1: ENTRY ============ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.7s" fill="freeze"/>
    <text x="14" y="103" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#6B7280">ENTRY</text>

    <!-- Card A -->
    <rect x="100" y="76" width="265" height="44" rx="10" fill="#00FF85" opacity="0.12" filter="url(#glow)">
      <animate attributeName="opacity" values="0.10;0.28;0.10" dur="2.6s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <rect x="100" y="76" width="265" height="44" rx="10" fill="#1C2238" stroke="#2A3350" stroke-width="1.2"/>
    <circle cx="118" cy="98" r="5" fill="#00FF85" filter="url(#glow)">
      <animate attributeName="r" values="5;6.2;5" dur="2.6s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <text x="134" y="102" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#EDF0F7">Visitor Auth (QR + ID)</text>

    <!-- Card B -->
    <rect x="385" y="76" width="275" height="44" rx="10" fill="#00FF85" opacity="0.12" filter="url(#glow)">
      <animate attributeName="opacity" values="0.10;0.28;0.10" dur="2.6s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="385" y="76" width="275" height="44" rx="10" fill="#1C2238" stroke="#2A3350" stroke-width="1.2"/>
    <circle cx="403" cy="98" r="5" fill="#00FF85" filter="url(#glow)">
      <animate attributeName="r" values="5;6.2;5" dur="2.6s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <text x="419" y="102" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#EDF0F7">Staff RFID / NFC Cards</text>
  </g>

  <!-- ============ LAYER 2: POLICY ============ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.7s" fill="freeze"/>
    <text x="14" y="167" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#6B7280">POLICY</text>

    <!-- Card A -->
    <rect x="100" y="140" width="360" height="44" rx="10" fill="#00FF85" opacity="0.12" filter="url(#glow)">
      <animate attributeName="opacity" values="0.10;0.28;0.10" dur="2.6s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="100" y="140" width="360" height="44" rx="10" fill="#1C2238" stroke="#2A3350" stroke-width="1.2"/>
    <circle cx="118" cy="162" r="5" fill="#00FF85" filter="url(#glow)">
      <animate attributeName="r" values="5;6.2;5" dur="2.6s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <text x="134" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#EDF0F7">Access Control — RBAC (least privilege)</text>

    <!-- Card B -->
    <rect x="480" y="140" width="180" height="44" rx="10" fill="#00FF85" opacity="0.12" filter="url(#glow)">
      <animate attributeName="opacity" values="0.10;0.28;0.10" dur="2.6s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="480" y="140" width="180" height="44" rx="10" fill="#1C2238" stroke="#2A3350" stroke-width="1.2"/>
    <circle cx="498" cy="162" r="5" fill="#00FF85" filter="url(#glow)">
      <animate attributeName="r" values="5;6.2;5" dur="2.6s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <text x="514" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#EDF0F7">Immutable Audit Log</text>
  </g>

  <!-- ============ LAYER 3: PHYSICAL ============ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.7s" fill="freeze"/>
    <text x="14" y="231" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#6B7280">PHYSICAL</text>

    <!-- Card A -->
    <rect x="100" y="204" width="265" height="44" rx="10" fill="#38BDF8" opacity="0.12" filter="url(#glow)">
      <animate attributeName="opacity" values="0.10;0.28;0.10" dur="2.6s" begin="1.0s" repeatCount="indefinite"/>
    </rect>
    <rect x="100" y="204" width="265" height="44" rx="10" fill="#1C2238" stroke="#2A3350" stroke-width="1.2"/>
    <circle cx="118" cy="226" r="5" fill="#38BDF8" filter="url(#glow)">
      <animate attributeName="r" values="5;6.2;5" dur="2.6s" begin="1.0s" repeatCount="indefinite"/>
    </circle>
    <text x="134" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#EDF0F7">Smart Destination Elevators</text>

    <!-- Card B -->
    <rect x="385" y="204" width="275" height="44" rx="10" fill="#38BDF8" opacity="0.12" filter="url(#glow)">
      <animate attributeName="opacity" values="0.10;0.28;0.10" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="385" y="204" width="275" height="44" rx="10" fill="#1C2238" stroke="#2A3350" stroke-width="1.2"/>
    <circle cx="403" cy="226" r="5" fill="#38BDF8" filter="url(#glow)">
      <animate attributeName="r" values="5;6.2;5" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
    </circle>
    <text x="419" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#EDF0F7">Door / Contact Sensors</text>
  </g>

  <!-- ============ LAYER 4: DETECTION (cyan accent) ============ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.7s" fill="freeze"/>
    <text x="14" y="295" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#6B7280">DETECTION</text>

    <rect x="100" y="268" width="560" height="44" rx="10" fill="#38BDF8" opacity="0.16" filter="url(#glow)">
      <animate attributeName="opacity" values="0.12;0.32;0.12" dur="2.4s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="100" y="268" width="560" height="44" rx="10" fill="#1C2238" stroke="#38BDF8" stroke-width="1.4"/>
    <circle cx="118" cy="290" r="5.5" fill="#38BDF8" filter="url(#glow)">
      <animate attributeName="r" values="5.5;7;5.5" dur="2.4s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="134" y="294" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#EDF0F7">AI CCTV Anomaly Detection</text>

    <!-- blinking threat-red alert badge -->
    <circle cx="638" cy="278" r="4.2" fill="#FF3B3B" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.15;1" dur="1s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============ LAYER 5: RESPONSE (amber/green accent) ============ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.0s" dur="0.7s" fill="freeze"/>
    <text x="14" y="359" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#6B7280">RESPONSE</text>

    <!-- Card A: Alert Service -->
    <rect x="100" y="332" width="250" height="44" rx="10" fill="#FFB020" opacity="0.14" filter="url(#glow)">
      <animate attributeName="opacity" values="0.10;0.30;0.10" dur="2.2s" begin="2.0s" repeatCount="indefinite"/>
    </rect>
    <rect x="100" y="332" width="250" height="44" rx="10" fill="#1C2238" stroke="#FFB020" stroke-width="1.3"/>
    <circle cx="118" cy="354" r="5" fill="#FFB020" filter="url(#glow)">
      <animate attributeName="r" values="5;6.4;5" dur="1.1s" begin="2.0s" repeatCount="indefinite"/>
    </circle>
    <text x="134" y="358" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#EDF0F7">Alert Service (SOAR)</text>

    <!-- Arrow -->
    <line x1="354" y1="354" x2="384" y2="354" stroke="#FFB020" stroke-width="2.5" stroke-dasharray="4,3">
      <animate attributeName="stroke-dashoffset" values="0;-14" dur="0.8s" repeatCount="indefinite"/>
    </line>
    <polygon points="384,349 392,354 384,359" fill="#FFB020"/>

    <!-- Card B: SOC Dashboard -->
    <rect x="390" y="332" width="270" height="44" rx="10" fill="#00FF85" opacity="0.14" filter="url(#glow)">
      <animate attributeName="opacity" values="0.10;0.30;0.10" dur="2.2s" begin="2.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="390" y="332" width="270" height="44" rx="10" fill="#1C2238" stroke="#00FF85" stroke-width="1.3"/>
    <circle cx="408" cy="354" r="5" fill="#00FF85" filter="url(#glow)">
      <animate attributeName="r" values="5;6.4;5" dur="2.2s" begin="2.3s" repeatCount="indefinite"/>
    </circle>
    <text x="424" y="358" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#EDF0F7">SOC Dashboard</text>
  </g>

  <!-- ============ Vertical HA tag on right edge ============ -->
  <g transform="rotate(-90 738 258)">
    <text x="738" y="258" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#00FF85">
      REDUNDANT / HA — NO SINGLE POINT OF FAILURE
      <animate attributeName="opacity" values="0.55;1;0.55" dur="2.8s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Caption -->
  <text x="380" y="462" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-style="italic" fill="#6B7280">Every layer verifies independently — one failed sensor doesn't collapse security.</text>
</svg>
